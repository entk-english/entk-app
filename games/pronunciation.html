<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Seeker — American Pronunciation Battle</title>
<style>
  :root{
    --bg1:#150c30; --bg2:#080418;
    --panel:rgba(40,24,74,0.72); --panel-border:rgba(124,92,200,0.45);
    --accent:#7cf5c4; --accent2:#ffd166; --danger:#ff5d73; --gold:#ffc94d;
    --text:#f3eeff; --muted:#a996d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg2);
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  body::before{content:'';position:fixed;inset:0;z-index:-2;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,#2a1a5c,transparent 70%),
               radial-gradient(ellipse 60% 50% at 80% 100%,#1d2a5e,transparent 70%),
               linear-gradient(180deg,#150c30,#080418);}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:20px;overflow-y:auto;}
  .screen.active{display:flex;}

  /* ---------- SETUP ---------- */
  #setupCard{width:min(680px,94vw);background:var(--panel);border:1px solid var(--panel-border);
    border-radius:20px;padding:28px 30px;backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);}
  .brand{text-align:center;margin-bottom:22px;}
  .brand h1{margin:0;font-size:30px;letter-spacing:-0.5px;
    background:linear-gradient(120deg,#fff,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{margin:6px 0 0;color:var(--muted);font-size:13px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  textarea,input[type=text]{width:100%;background:rgba(10,4,26,0.7);
    border:1px solid var(--panel-border);color:var(--text);border-radius:10px;
    padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;}
  textarea:focus,input:focus{border-color:var(--accent);}
  textarea{min-height:92px;resize:vertical;line-height:1.5;}
  .btn{background:linear-gradient(180deg,#8ffcd0,#3fae7f);border:none;color:#06251a;
    font-weight:700;font-size:15px;padding:13px 28px;border-radius:11px;cursor:pointer;
    box-shadow:0 4px 0 #2b8a64;transition:transform .06s,box-shadow .06s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b8a64;}
  .btn.ghost{background:rgba(255,255,255,0.07);color:var(--text);
    border:1px solid var(--panel-border);box-shadow:none;}
  .btn.ghost:active{transform:translateY(2px);}
  .btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a520);color:#3a2600;box-shadow:0 4px 0 #a87610;}
  .btnRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  .chip{background:rgba(124,245,196,0.12);border:1px solid rgba(124,245,196,0.35);
    color:var(--accent);font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;}
  .chip:hover{background:rgba(124,245,196,0.22);}
  #shareBox{margin-top:14px;padding:13px 15px;background:rgba(255,201,77,0.08);
    border:1px solid rgba(255,201,77,0.35);border-radius:11px;display:none;}
  #shareBox.show{display:block;}
  #shareBox .lbl{font-size:11px;color:var(--gold);text-transform:uppercase;
    letter-spacing:1px;font-weight:700;margin-bottom:7px;}
  #shareUrl{width:100%;font-size:11px;background:rgba(0,0,0,0.35);color:var(--muted);
    border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:8px 10px;
    font-family:ui-monospace,monospace;}

  /* ---------- BATTLE ---------- */
  #battleWrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  canvas{border-radius:18px;display:block;max-width:96vw;max-height:64vh;
    box-shadow:0 24px 70px rgba(0,0,0,0.65), 0 0 0 1px rgba(124,92,200,0.4);}
  #controls{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;}
  #micBtn{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;font-size:34px;
    background:radial-gradient(circle at 35% 28%,#9dffd9,#33a578);color:#052a1c;
    box-shadow:0 7px 0 #237a56, 0 0 30px rgba(124,245,196,0.35);
    transition:transform .07s,box-shadow .07s;}
  #micBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #237a56;}
  #micBtn:disabled{opacity:0.35;cursor:not-allowed;}
  #micBtn.retry{background:radial-gradient(circle at 35% 28%,#ffdf9d,#e0a520);
    box-shadow:0 7px 0 #a87610, 0 0 26px rgba(255,201,77,0.45);}
  #micBtn.listening{background:radial-gradient(circle at 35% 28%,#ffc2ca,#e8455e);
    box-shadow:0 7px 0 #a32d40;animation:pulseMic 1.15s infinite;}
  @keyframes pulseMic{
    0%{box-shadow:0 7px 0 #a32d40, 0 0 0 0 rgba(255,93,115,0.55);}
    70%{box-shadow:0 7px 0 #a32d40, 0 0 0 26px rgba(255,93,115,0);}
    100%{box-shadow:0 7px 0 #a32d40, 0 0 0 0 rgba(255,93,115,0);}
  }
  .sideBtns{display:flex;flex-direction:column;gap:7px;}
  .miniBtn{background:rgba(255,255,255,0.08);border:1px solid var(--panel-border);
    color:var(--text);font-size:12px;padding:8px 15px;border-radius:9px;cursor:pointer;
    white-space:nowrap;transition:background .15s;}
  .miniBtn:hover{background:rgba(255,255,255,0.16);}
  .miniBtn:disabled{opacity:0.35;cursor:not-allowed;}
  /* The trainer's verdict is the real score, so it gets real estate. */
  #markRow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:11px;flex-wrap:wrap;}
  #markRow .markLabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
  .markBtn{border:none;border-radius:11px;padding:11px 22px;font-size:15px;font-weight:800;
    cursor:pointer;font-family:inherit;transition:transform .06s,box-shadow .06s,filter .15s;}
  .markBtn:active{transform:translateY(3px);}
  .markBtn:disabled{opacity:.35;cursor:not-allowed;}
  .markBtn.good{background:linear-gradient(180deg,#8ffcd0,#3fae7f);color:#06251a;box-shadow:0 4px 0 #2b8a64;}
  .markBtn.good:active{box-shadow:0 1px 0 #2b8a64;}
  .markBtn.bad{background:linear-gradient(180deg,#ff9aa8,#d63a51);color:#2c0209;box-shadow:0 4px 0 #93202f;}
  .markBtn.bad:active{box-shadow:0 1px 0 #93202f;}
  #micHelp{text-align:center;font-size:12px;color:var(--muted);margin-top:7px;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}

  #micHelp #micHint{opacity:.6;}
  #statusLine{text-align:center;font-size:14px;color:var(--muted);min-height:20px;
    max-width:640px;line-height:1.4;}
  #statusLine b{color:var(--accent2);}

  /* ---------- RESULTS ---------- */
  #resultsCard{width:min(620px,94vw);background:var(--panel);border:1px solid var(--panel-border);
    border-radius:20px;padding:28px 30px;backdrop-filter:blur(14px);max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  #resultsCard h2{margin:0 0 4px;font-size:26px;text-align:center;}
  #resultsSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;}
  .wordRow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
    background:rgba(255,255,255,0.04);margin-bottom:8px;}
  .wordRow .w{font-weight:700;font-size:16px;min-width:96px;}
  .wordRow .stars{font-size:15px;letter-spacing:1px;min-width:52px;}
  .wordRow .tip{font-size:11.5px;color:var(--muted);flex:1;line-height:1.35;}
  .wordRow .pct{font-size:13px;font-weight:700;min-width:44px;text-align:right;}
</style>

<body>

    </div>
    <div class="btnRow">
      <button class="btn" id="startBtn">⚔ Generate battle</button>
      <button class="btn ghost" id="shareBtn">🔗 Create trainee link</button>

<!-- ============ BATTLE SCREEN ============ -->

    <div id="controls">

</div>

      <button class="btn ghost" id="newRoundBtn">＋ New round</button>
    </div>
  </div>
</div>

<script>
"use strict";
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y); this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]); this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h); this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]); this.quadraticCurveTo(x,y,x+r[0],y);
    return this;
  };
}

/* ============================================================
   AMERICAN PRONUNCIATION RULE ENGINE
   Each word the trainer types is auto-analyzed and tagged with
   the American-accent rule it exercises, plus a coaching tip and
   a plain-English respelling the trainee can actually read.
   ============================================================ */
// words ending in "s" that are NOT plurals/3rd-person verbs — they must not
// be graded as an "-S ending" drill
// the T here keeps its full sound because the NEXT syllable is stressed
const NO_FLAP = new Set(['attack','attempt','attend','attach','attain','attract','attire',
  'hotel','until','untie','return','retire','retain','retreat','detail','detain','detect',
  'guitar','eternal','italian','potential','material','maintain','obtain','contain','pretend',
  'protect','protest','routine','fatigue','boutique','utensil','utility','atomic','italic']);

const NON_PLURAL_S = new Set(['this','his','is','was','has','yes','us','thus','plus','gas',
  'bus','less','miss','class','glass','press','cross','always','perhaps','across','unless',
  'business','illness','address','famous','nervous','serious','various','curious','bonus']);

const RULES = [
  {
    id:'edEnding', name:'-ED ending',
    test:w=>/ed$/.test(w)&&w.length>3,
    tip:'After t/d say "id". After voiceless sounds (k,p,s,f,ch,sh) say "t". Otherwise say "d". Never "e-d".',
    respell:w=>{
      const s=w.slice(0,-2);
      if(/[td]$/.test(s)) return s+'-id';
      if(/(k|p|s|f|x|ch|sh)$/.test(s)) return s+'t';
      return s+'d';
    }
  },
  {
    id:'sEnding', name:'-S ending',
    test:w=>/s$/.test(w)&&w.length>3&&!/ss$/.test(w)&&!NON_PLURAL_S.has(w),
    tip:'After s/z/sh/ch/x say "iz". After voiceless sounds say "s". Otherwise it\'s a buzzing "z".',
    respell:w=>{
      // "boxes"/"washes" take a full -iz syllable; strip the whole "es"
      if(/([sxz]|sh|ch|ge)es$/.test(w)) return w.slice(0,-2)+'-iz';
      const s=w.slice(0,-1);
      if(/(k|p|t|f|th)$/.test(s)) return s+'s';
      return s+'z';
    }
  },
  {
    id:'flapT', name:'Flap T',
    // T becomes a quick tap between vowels, after R, or before a syllabic L —
    // but NOT word-initially, not in "-tion/-tial", and not when the syllable
    // after the T carries the stress (attack, hotel, return…)
    test:w=>!/^t/.test(w) && !/ti(on|al|ous|an|ent)/.test(w) && !NO_FLAP.has(w) &&
            ( /[aeiouy][r]?(tt|t)[aeiouy]/.test(w) || /(tt|t)le$/.test(w) ),
    tip:'Between vowels, American T sounds like a quick D. Tap the tongue — don\'t punch the T.',
    respell:w=>{
      if(/(tt|t)le$/.test(w)) return w.replace(/(tt|t)le$/,'dle');
      // flap the LAST eligible T — in "potato" it's the second one that taps
      let out=w, last=-1, re=/([aeiouy][r]?)(tt|t)(?=[aeiouy])/g, m;
      while((m=re.exec(w))!==null){ last=m.index; re.lastIndex=m.index+1; }
      if(last>=0){
        const mm=/([aeiouy][r]?)(tt|t)/.exec(w.slice(last));
        if(mm) out = w.slice(0,last)+mm[1]+'d'+w.slice(last+mm[0].length);
      }
      return out;
    }
  },
  {
    id:'th', name:'TH sound',
    test:w=>/th/.test(w),
    tip:'Tongue tip lightly between the teeth. Not "d", not "z", not "s".',
    respell:null
  },
  {
    id:'ing', name:'-ING ending',
    test:w=>/ing$/.test(w),
    tip:'End in the back of the nose: "-ing", not "-een" and not "-in\'".',
    respell:null
  },
  {
    id:'rColored', name:'R-colored vowel',
    test:w=>/(er|ir|ur|or|ar|ear|our)/.test(w),
    tip:'Curl the tongue back and hold the R. American R is strong — never drop it.',
    respell:null
  },
  {
    id:'darkL', name:'Dark L',
    test:w=>/l$/.test(w)||/le$/.test(w)||/l[bcdfgkmnpstvz]/.test(w),
    tip:'Back of the tongue lifts — a heavy, hollow L. Sounds almost like "oh" before the L.',
    respell:null
  },
  {
    id:'silent', name:'Silent letter',
    test:w=>/^(kn|wr|gn|ps)/.test(w)||/mb$/.test(w)||/(gh|lk|st[ae]n)/.test(w),
    tip:'Some letters here are silent — say only the sounds, not the spelling.',
    respell:null
  },
  {
    id:'schwa', name:'Schwa reduction',
    test:w=>w.length>=7,
    tip:'Stress ONE syllable hard; squeeze the rest into a lazy "uh". English is not evenly timed.',
    respell:null
  }
];
const DEFAULT_RULE = {
  id:'clear', name:'Clear articulation',
  tip:'Say it fully and confidently — open the mouth and finish the final sound.',
  respell:null
};

function analyzeWord(raw){
  const word = String(raw).trim();
  const w = word.toLowerCase();
  for(const r of RULES){
    try{ if(r.test(w)) return { word, rule:r, respell: r.respell? r.respell(w): null }; }
    catch(e){ /* a bad regex must never break round creation */ }
  }
  return { word, rule:DEFAULT_RULE, respell:null };
}

/* ============================================================
   BOSS ROSTER (from the character sheet)
   ============================================================ */
const BOSSES = [
  { name:'Word Wizard',       art:'boss-01-inkblot', type:'wraith',  hue:265, hp:100 },
  { name:'Tense Troll',       art:'boss-02-dictionary', type:'troll',   hue:100, hp:115 },
  { name:'Subject Specter',   art:'boss-03-tiles', type:'ghost',   hue:195, hp:105 },
  { name:'Ending Eater',      art:'boss-04-typewriter', type:'slime',   hue:95,  hp:120 },
  { name:'Connector Count',   art:'boss-05-scroll', type:'vampire', hue:345, hp:125 },
  { name:'Pronoun Patrol',    art:'boss-06-quillbird', type:'robot',   hue:205, hp:120 },
  { name:'Punctuation Beast', art:'boss-07-glue', type:'dragon',  hue:15,  hp:140 },
  { name:'Adjective Witch',   art:'boss-01-inkblot', type:'witch',   hue:280, hp:130 },
  { name:'Overlord',          art:'boss-02-dictionary', type:'knight',  hue:220, hp:145 },
  { name:'Infinitive Mimic',  art:'boss-03-tiles', type:'book',    hue:35,  hp:135 }
];

const PRESETS = [
  { label:'Flap T', words:'water, better, little, city, party' },
  { label:'TH', words:'think, this, three, mother, birthday' },
  { label:'-ED', words:'walked, played, wanted, jumped, needed' },
  { label:'-S', words:'cats, dogs, boxes, washes, watches' },
  { label:'R sound', words:'world, first, girl, work, water' },
  { label:'Dark L', words:'milk, feel, cold, people, table' }
];

/* ============================================================
   ACCENT DIAGNOSIS
   When the recognizer hears a DIFFERENT real word, that mishearing
   is itself evidence of which American sound went wrong. Mapping the
   common substitutions lets us name the exact error instead of just
   saying "wrong".
   ============================================================ */
const SUBSTITUTIONS = [
  { from:/^(s|f)(ink|ought|ree|understand)/, when:/^th/,
    say:'You replaced TH with S/F. Tongue tip between the teeth, blow air.' },
  { from:/^(d|z)/, when:/^th/,
    say:'You replaced TH with D/Z. Touch the tongue tip to the teeth, let it buzz.' },
  { from:/^t/,   when:/^th/,   say:'You said a hard T instead of TH. Tongue must touch the teeth.' },
  { from:/^w/,   when:/^v/,    say:'V, not W. Top teeth on the bottom lip.' },
  { from:/^v/,   when:/^w/,    say:'W, not V. Round the lips, no teeth.' },
  { from:/^l/,   when:/^r/,    say:'R, not L. Curl the tongue back, do not touch the roof.' },
  { from:/^r/,   when:/^l/,    say:'L, not R. Tongue tip up on the ridge behind the teeth.' },
  { from:/^b/,   when:/^p/,    say:'P is voiceless — add a puff of air, no voice.' },
  { from:/^p/,   when:/^b/,    say:'B is voiced — hum through it.' },
  { from:/^sh/,  when:/^ch/,   say:'CH starts with a T-burst: t+sh, not a plain sh.' },
  { from:/^ch/,  when:/^sh/,   say:'SH is smooth — no T at the front.' },
  { from:/^(ship|shit|sit|bit|bid|lift)$/, when:/^(sheep|seat|beat|bead|leaf)$/,
    say:'Vowel too short. Long EE — stretch it.' },
  { from:/^(sheep|seat|beat)$/, when:/^(ship|sit|bit)$/,
    say:'Vowel too long. Short I — relax and clip it.' }
];

// heard vs target both normalised, lowercase
function diagnose(target, heard){
  if(!heard) return null;
  const t=target.toLowerCase(), h=heard.toLowerCase().trim().split(/\s+/)[0]||'';
  if(!h || h===t) return null;
  for(const s of SUBSTITUTIONS){
    if(s.when.test(t) && s.from.test(h)) return s.say;
  }
  // dropped ending is the other very common American-accent failure
  if(t.length-h.length>=1 && t.startsWith(h)){
    const tail=t.slice(h.length);
    if(/^(ed|d|t)$/.test(tail)) return 'You dropped the -ED ending. It must be heard.';
    if(/^(s|es|z)$/.test(tail)) return 'You dropped the final S. It must be heard.';
    return 'You cut the end of the word off. Finish the final sound.';
  }
  return null;
}

/* ============================================================
   STATE
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const MAX_ATTEMPTS = 3;   // trainee gets retries; best score counts

const state = {
  entries: [],        // {word, rule, respell, meaning, isVocab}
  idx: 0,
  attempt: 0,         // attempts used on the current word
  bestPct: 0,         // best score so far on the current word
  lastHeard: '',
  boss: BOSSES[0],
  bossIdx: 0,
  heroHP: 100, heroMax: 100, heroShown: 100,
  bossHP: 100, bossMax: 100, bossShown: 100,
  combo: 0, bestCombo: 0, score: 0,
  results: [],        // {word, pct, stars, rule}
  busy: false, running: false
};

function heroPos(){ return {x:190,y:352}; }
function bossPos(){ return {x:745,y:312}; }

let projectiles=[], particles=[], popups=[], rings=[];

/* ============================================================
   AUDIO — tiny synth so hits/wins have feel without asset files
   ============================================================ */
let actx=null;
/* Sounds are synthesised rather than loaded: no files to host, nothing
   to wait for, and it cannot break a lesson by failing to download. */
function tone(freq, dur, kind, vol, slideTo){
  if(!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = kind || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}

function noiseHit(dur, vol){
  if(!actx) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<n;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.2);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = vol || 0.3;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start();
}

function sfx(type){
  /* the richer impacts sit alongside the original chimes */
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(type==='flame'){ noiseHit(0.34,0.34); tone(180,0.3,'sawtooth',0.16,60); return; }
    if(type==='blast'){ noiseHit(0.5,0.45); tone(120,0.45,'square',0.2,40); tone(320,0.3,'sawtooth',0.12,90); return; }
    if(type==='land'){ noiseHit(0.28,0.4); tone(90,0.26,'sine',0.24,45); return; }
    if(type==='march'){ tone(320,0.07,'triangle',0.07); return; }
  }catch(e){}
  return sfxLegacy(type);
}

function sfxLegacy(type){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    if(type==='hit'){ o.type='triangle'; o.frequency.setValueAtTime(680,t);
      o.frequency.exponentialRampToValueAtTime(180,t+0.18); g.gain.setValueAtTime(0.18,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.start(t); o.stop(t+0.21); }
    else if(type==='miss'){ o.type='sawtooth'; o.frequency.setValueAtTime(200,t);
      o.frequency.exponentialRampToValueAtTime(70,t+0.25); g.gain.setValueAtTime(0.14,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t); o.stop(t+0.29); }
    else if(type==='win'){ [523,659,784,1047].forEach((f,i)=>{
        const oo=actx.createOscillator(), gg=actx.createGain();
        oo.connect(gg); gg.connect(actx.destination); oo.type='triangle';
        oo.frequency.setValueAtTime(f,t+i*0.1); gg.gain.setValueAtTime(0.14,t+i*0.1);
        gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.28);
        oo.start(t+i*0.1); oo.stop(t+i*0.1+0.3); }); }
  }catch(e){}
}

/* ============================================================
   ROUND SETUP + SHARE LINKS
   ============================================================ */
// words = plain drill words; vocab = [{word, meaning}] shown with its meaning
function buildRound(words, vocab){
  const drill = (words||[]).map(w=>analyzeWord(w));
  const vlist = (vocab||[]).map(v=>{
    const e = analyzeWord(v.word);
    e.meaning = v.meaning || '';
    e.isVocab = true;
    return e;
  });
  state.entries = drill.concat(vlist);
  state.idx = 0;
  state.attempt = 0; state.bestPct = 0; state.lastHeard='';
  state.boss = BOSSES[state.bossIdx % BOSSES.length];
  state.heroHP = state.heroMax = 100; state.heroShown = 100;
  state.bossHP = state.bossMax = state.boss.hp; state.bossShown = state.boss.hp;
  state.combo = 0; state.bestCombo = 0; state.score = 0;
  state.results = [];
  state.busy = false; state.running = true;
  projectiles=[]; particles=[]; popups=[]; rings=[];
  bossAnim.dead = 0;
  lastBlob = null;
  const pb=document.getElementById('playbackBtn'); if(pb) pb.disabled = true;
  preloadIPA(state.entries);
  state.cleared = 0;
  state.levelBanner = 0;
  if(state.entries.length) startLevel(false);
}

function parseWords(raw){
  return String(raw).split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).slice(0,20);
}

// "word = meaning" per line; a bare word is allowed (no meaning)
function parseVocab(raw){
  return String(raw).split(/\n+/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const m = /^(.+?)\s*[=:–-]\s*(.+)$/.exec(line);
    return m ? { word:m[1].trim(), meaning:m[2].trim() } : { word:line, meaning:'' };
  }).filter(v=>v.word).slice(0,20);
}

function encodeRound(words, vocab){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify({w:words, v:vocab||[]})))); }
  catch(e){ return ''; }
}
function decodeRound(hash){
  try{
    const m = /[#&]r=([^&]+)/.exec(hash);
    if(!m) return null;
    // the payload may arrive percent-encoded when the host app builds the link
    const raw = /%[0-9a-fA-F]{2}/.test(m[1]) ? decodeURIComponent(m[1]) : m[1];
    const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
    const w = Array.isArray(obj.w) ? obj.w : [];
    const v = Array.isArray(obj.v) ? obj.v : [];
    return (w.length||v.length) ? {words:w, vocab:v} : null;
  }catch(e){ return null; }
}

const micBtn = document.getElementById('micBtn');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition=null, listening=false, gotResult=false;
let mediaRecorder=null, chunks=[], lastBlob=null, micStream=null;

if(SR){
  recognition = new SR();
  recognition.lang='en-US';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=5;   // more alternatives => better scoring signal

  recognition.onresult = e=>{
    gotResult = true;
    const alts=[];
    for(let i=0;i<e.results[0].length;i++){
      alts.push({ text:e.results[0][i].transcript, conf:e.results[0][i].confidence||0 });
    }
    scoreAttempt(alts);
  };
  recognition.onerror = e=>{
    stopListening();
    /* The recogniser is only a hint now, so its failures are not the
       trainee's failures and must not read like one. The recording is
       what matters, and it is made regardless. */
    if(e.error==='not-allowed') setStatus('🎤 Microphone blocked — allow mic access in the browser, then try again.');
    else setStatus('Recorded. Play it back with <b>▶ My recording</b> — your trainer decides the hit.');
  };
  recognition.onend = ()=>{
    stopListening();
    if(gotResult) return;
    setStatus('Recorded. Play it back with <b>▶ My recording</b> — your trainer decides the hit.');
  };
}else{
  micBtn.disabled = true;
}

let recordPlayback = true;
(function wireRecToggle(){

function stopListening(){
  listening=false;
  micBtn.classList.remove('listening');
  if(mediaRecorder && mediaRecorder.state==='recording'){ try{ mediaRecorder.stop(); }catch(e){} }
  else releaseMic();

/* The trainee closing the microphone by hand: stop the recogniser too,
   then let the recorder's own stop handler save the take. */
function stopRecording(){
  try{ if(recognition) recognition.stop(); }catch(e){}
  stopListening();
  setStatus('Saved. Play it back with <b>▶ My recording</b>, or tap the mic to try again.');
}

// Ask for the mic once when the battle opens, not on the first attempt —
// otherwise the permission prompt eats the trainee's first spoken word.
// The stream is released straight away: the point is to bank the permission,
// and an open capture sitting idle competes with the recognizer for the
// device on Windows, which shows up as "I spoke and nothing happened".
async function warmUpMic(){
  try{
    if(navigator.mediaDevices){
      const s = await navigator.mediaDevices.getUserMedia({audio:true});
      releaseMic(s);
    }
  }catch(e){
    setStatus('🎤 Microphone blocked. Click the padlock in the address bar, allow the microphone, then reload.');
  }
  setupLocalSpeech();
}

function releaseMic(s){
  const target = s || micStream;
  if(target){ try{ target.getTracks().forEach(t=>t.stop()); }catch(e){} }
  if(!s) micStream = null;
}

/* ------------------------------------------------------------
   OFFLINE SPEECH
   By default Chrome streams the audio to Google and waits for the
   text to come back. On a connection that cannot reach it, that
   round trip simply never completes: recognition starts, hangs,
   and ends with no result and no error. Chrome can also run the
   recognizer on the machine itself, which removes the network from
   the picture entirely — preferred here whenever it is available.
   ------------------------------------------------------------ */
let speechMode = 'cloud';
let emptyRuns = 0;

function setSpeechLabel(text, good){
  const el = document.getElementById('speechMode');
  if(!el) return;
  el.textContent = text;
  el.style.color = good ? 'var(--accent)' : 'var(--muted)';
}

/* Never let a capability probe hold the game up: if it has not
   answered in a few seconds, carry on with the online recognizer. */
function withTimeout(promise, ms, fallback){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(()=>resolve(fallback), ms))
  ]);
}

/* Deliberately never probed automatically. Chrome's on-device
   availability check can block the renderer while it answers, and a
   game that freezes at the start of a round is worse than one that
   needs a working connection. So the trainer asks for it, once, and
   only then does anything run. */
function setupLocalSpeech(){
  const b = document.getElementById('localBtn');
  if(!recognition || !SR || typeof SR.available !== 'function'){
    setSpeechLabel('online speech', false);
    if(b) b.style.display = 'none';
    return;
  }
  setSpeechLabel('online speech', false);
  if(b) b.style.display = '';
}

(function wireLocalBtn(){
  const b = document.getElementById('localBtn');
  if(!b) return;
  b.onclick = async ()=>{
    b.disabled = true; b.textContent = 'Checking…';
    setStatus('Setting up offline speech — this can take a moment the first time.');
    try{
      let state = await withTimeout(
        SR.available({ langs:['en-US'], processLocally:true }), 8000, 'timeout');

      if(state === 'downloadable' || state === 'downloading'){
        b.textContent = 'Downloading…';
        const ok = await withTimeout(
          SR.install({ langs:['en-US'], processLocally:true }), 120000, false);
        state = ok ? 'available' : 'unavailable';
      }

      if(state === 'available'){
        recognition.processLocally = true;
        speechMode = 'on-device';
        setSpeechLabel('offline speech ✓', true);
        b.style.display = 'none';
        setStatus('Offline speech ready — tap the mic and say <b>'+current().word+'</b>.');
        return;
      }

      b.disabled = false; b.textContent = '⬇ Use offline speech';
      setStatus(state === 'timeout'
        ? 'Offline speech did not answer in time. Staying on the online recogniser.'
        : 'Offline speech is not available for English on this machine.');
    }catch(e){
      b.disabled = false; b.textContent = '⬇ Use offline speech';
      setStatus('Could not switch to offline speech — '+e.message);
    }
  };
})();

micBtn.onclick = async ()=>{
  /* A second tap closes the microphone and banks the take. The
     recogniser used to decide when the trainee had finished speaking,
     which cut long words short and left the mic open on quiet ones —
     and an open microphone during a lesson is its own problem. */
  if(listening){ stopRecording(); return; }
  if(!recognition || state.busy || !state.running) return;
  listening=true; gotResult=false;
  micBtn.classList.add('listening');
  setStatus('Recording… say <b>'+current().word+'</b>, then <b>tap the microphone again</b> to stop.');
  // Capture audio in parallel so the trainee can hear themselves back.
  // Optional on purpose: on some machines a second capture running
  // alongside the recognizer is exactly what stops speech being heard,
  // so this can be switched off without losing the scoring.
  if(recordPlayback){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[]; mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = ev=>{ if(ev.data.size) chunks.push(ev.data); };
      const wordAtStart = current().word;
      mediaRecorder.onstop = ()=>{
        if(chunks.length){ lastBlob = new Blob(chunks,{type:chunks[0].type||'audio/webm'});
          document.getElementById('playbackBtn').disabled=false;
          /* The trainer is on another device and cannot hear the room in
             enough detail to judge a vowel. Hand the audio up so it can
             be carried to them. */
          if(EMBEDDED && !MONITOR){
            try{
              window.parent.postMessage({ source:'antoch-game', game:'pronunciation',
                type:'recording', blob:lastBlob, word:wordAtStart, at:Date.now() }, '*');
            }catch(e){}
          }
        }
        releaseMic();   // never leave the device held open between attempts
      };
      mediaRecorder.start();
    }catch(e){ /* recording is a bonus; scoring still works without it */ }
  }
  try{ recognition.start(); }catch(e){ stopListening(); }
};

/* ------------------------------------------------------------
   PRONUNCIATION DICTIONARY
   Every word the trainer types gets a phonetic line under it. The
   lookup is free and keyless but returns British first for many
   words, so American variants are preferred: they carry the rhotic
   r. Results are cached, and the rule-based respelling already in
   the game remains the fallback when the lookup fails.
   ------------------------------------------------------------ */
const ipaCache = {};

function pickAmerican(entry){
  const list = (entry.phonetics||[]).map(p=>p.text).filter(Boolean);
  if(!list.length) return entry.phonetic || '';
  const rhotic = list.find(p=>/ɹ|ɚ|ɝ/.test(p));
  if(rhotic) return rhotic;
  const aVowel = list.find(p=>/ɑ|æ/.test(p));
  return aVowel || list[0];
}

/* The dictionary answer for a word never changes, so it is worth
   keeping between rounds and between reloads. Restarting the game used
   to re-fetch every word over the network before the first monster
   appeared, which is most of what "the game takes too long to reload"
   was. A stored answer is instant and works offline. */
const IPA_STORE = 'ast:ipa';
let ipaDisk = {};
try{ ipaDisk = JSON.parse(localStorage.getItem(IPA_STORE)) || {}; }catch(e){ ipaDisk = {}; }
let ipaFlush = null;
function rememberIPA(key, value){
  ipaDisk[key] = value;
  clearTimeout(ipaFlush);
  ipaFlush = setTimeout(()=>{
    try{ localStorage.setItem(IPA_STORE, JSON.stringify(ipaDisk)); }catch(e){}
  }, 400);
}

async function lookupIPA(word){
  const key = String(word||'').toLowerCase().trim();
  if(!key) return '';
  if(key in ipaCache) return ipaCache[key];
  if(key in ipaDisk){ ipaCache[key] = ipaDisk[key]; return ipaCache[key]; }
  ipaCache[key] = '';
  try{
    /* never let a slow dictionary hold up the first monster */
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = ctrl ? setTimeout(()=>ctrl.abort(), 4000) : null;
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),
                            ctrl ? {signal:ctrl.signal} : undefined);
    if(timer) clearTimeout(timer);
    if(res.ok){
      const j = await res.json();
      if(Array.isArray(j) && j[0]){
        ipaCache[key] = pickAmerican(j[0]);
        rememberIPA(key, ipaCache[key]);
      }
    }
  }catch(e){ /* offline, aborted or rate limited — the respelling still shows */ }
  return ipaCache[key];
}

/* fetch for the whole round up front so nothing stalls mid-battle */
function preloadIPA(entries){
  (entries||[]).forEach(en=>{
    lookupIPA(en.word).then(ipa=>{ if(ipa) en.ipa = ipa; });
  });
}

function current(){ return state.entries[state.idx] || {word:'',rule:DEFAULT_RULE}; }

function norm(s){ return String(s).toLowerCase().replace(/[^a-z]/g,''); }

/* Turn the recognizer's alternatives into a 0-100 pronunciation score.
   Exact top match with high confidence scores best; finding the word only
   in lower-ranked alternatives means it was said unclearly. */
/* ------------------------------------------------------------
   THE RECOGNISER DOES NOT PLAY THE GAME

   It transcribes, and its language model snaps a mispronounced word
   onto the nearest real one, so it cannot tell a good vowel from a bad
   one. Letting it land hits meant the fight reacted to a machine that
   was often wrong, in front of the trainee. So a spoken attempt now
   does exactly two things: it records, so the trainee can hear
   themselves, and it passes its guess up to the trainer's screen as a
   hint. The monster does not move until the trainer decides.
   ------------------------------------------------------------ */
function scoreAttempt(alts){
  const target = norm(current().word);
  let pct = 0, heard = alts[0] ? alts[0].text : '';
  for(let i=0;i<alts.length;i++){
    const words = norm(alts[i].text);
    const exact = words===target;
    const contains = new RegExp('(^|[^a-z])'+target+'([^a-z]|$)').test(' '+alts[i].text.toLowerCase()+' ');
    if(exact||contains){
      const rankPenalty = i*13;                       // lower alternative = less clear
      const conf = alts[i].conf>0 ? alts[i].conf : 0.82;
      let s = (exact?100:92) * (0.55 + 0.45*conf) - rankPenalty;
      pct = Math.max(pct, Math.round(Math.max(0,Math.min(100,s))));
    }
  }
  if(pct===0){
    // nothing matched — grade partial credit on letter overlap so a near-miss
    // isn't treated the same as saying a completely different word
    const h = norm(heard);
    let same=0;
    for(let i=0;i<Math.min(h.length,target.length);i++) if(h[i]===target[i]) same++;
    pct = Math.round(Math.max(0, Math.min(44, (same/Math.max(1,target.length))*44)));
  }
  state.lastPct = pct;      // kept for the record, shown to nobody
  handleAttempt(pct, heard);
}

function starsFor(pct){ return pct>=88?3 : pct>=72?2 : pct>=52?1 : 0; }

/* A word is not scored on one shot. The trainee gets up to MAX_ATTEMPTS and
   the BEST score is what counts — the point is to reach a correct American
   pronunciation, not to punish the first try. Only a fully used-up set of
   attempts with no passing score lets the boss strike. */
/* An attempt is banked, never judged here. No score on screen, no hit,
   no sound of failure — the trainee is told the take is saved and that
   their trainer is listening, which is the truth. */
function handleAttempt(pct, heard){
  state.attempt++;
  state.lastHeard = heard;
  if(pct > state.bestPct) state.bestPct = pct;
  micBtn.classList.remove('retry');
  setStatus('Recorded. Play it back with <b>▶ My recording</b>, or say <b>' +
            current().word + '</b> again. Your trainer decides the hit.');
}

/* ------------------------------------------------------------
   TRAINER MARKING
   The recognizer transcribes; it does not judge. Its language model
   snaps a mispronounced word onto the nearest real one, so a poor
   flap-t still comes back spelled correctly. Real phoneme scoring
   needs a paid API, so the ear in the room decides instead: the
   recognizer's guess stays on screen as a hint, and this is what
   actually lands the hit and goes into the record.
   ------------------------------------------------------------ */
function markManually(good){
  if(MONITOR) return;
  if(state.busy || !state.running) return;
  if(listening){ try{ recognition.stop(); }catch(e){} stopListening(); }
  micBtn.classList.remove('retry');
  applyResult(good ? 96 : 30, state.lastHeard || '', current(), true);
}

/* The trainee may open the shared link on their own device; the
   verdict belongs to the trainer, so the controls appear only when the
   game is embedded in the session app the trainer is running. */
/* A mark can now arrive from the trainer's device rather than from
   this keyboard. Each carries a sequence number so a repeated poll
   never lands the same hit twice. */
let lastRemoteMark = 0;
window.addEventListener('message', function(e){
  const m = e.data;
  if(!m || m.source !== 'antoch-host') return;
  if(m.type === 'mark'){
    if(MONITOR) return;              // a mirror is never the one playing
    if(!m.seq || m.seq <= lastRemoteMark) return;
    lastRemoteMark = m.seq;
    markManually(m.verdict === 'good');
  }
  if(m.type === 'sync' && MONITOR) applySnapshot(m.s);
  if(m.type === 'fx' && MONITOR) playFx(m.fx);
});

/* ------------------------------------------------------------
   MIRRORING
   The trainer used to watch a second, independent copy of this game,
   so a monster the trainee had already killed stood there alive on
   the trainer's screen. #monitor=1 puts the engine in read-only: it
   draws whatever snapshot the trainee's device sends and simulates
   nothing of its own. The trainee's copy publishes that snapshot on a
   timer — a timer, not requestAnimationFrame, because a backgrounded
   tab stops frames but keeps timers.
   ------------------------------------------------------------ */
const MONITOR = /[#&]monitor=1/.test(location.hash);
const EMBEDDED = window.parent !== window;

function snapshot(){
  return {
    at: Date.now(),
    idx: state.idx, bossIdx: state.bossIdx,
    bossHP: state.bossHP, bossMax: state.bossMax, bossScale: state.bossScale || 1,
    heroHP: state.heroHP, heroMax: state.heroMax,
    combo: state.combo, score: state.score, cleared: state.cleared || 0,
    attempt: state.attempt, running: state.running, busy: state.busy,
    count: state.entries.length, word: current().word,
    /* the recogniser's guess is a hint for the trainer's screen only */
    heard: state.lastHeard || '',
    status: document.getElementById('statusLine').innerHTML
  };
}

if(EMBEDDED && !MONITOR){
  setInterval(function(){
    if(!state.entries.length) return;
    try{
      window.parent.postMessage({ source:'antoch-game', game:'pronunciation',
        type:'state', s:snapshot() }, '*');
    }catch(e){}
  }, 500);
}

/* A snapshot every half second keeps the numbers honest, but it cannot
   show a blow being struck: by the time it arrives the swing is over.
   So the moment of impact is sent as an event of its own and the mirror
   replays it through the same routine the trainee's screen used —
   projectile, rings, sparks, damage number, the lot. Silent, because
   the trainer is listening to the trainee, not to this. */
function emitFx(fx){
  if(!(EMBEDDED && !MONITOR)) return;
  try{
    window.parent.postMessage({ source:'antoch-game', game:'pronunciation',
      type:'fx', fx:fx }, '*');
  }catch(e){}
}

function playFx(fx){
  if(!fx) return;
  if(fx.kind === 'attack'){
    const atk = attackFor(fx.combo || 1, fx.stars || 3);
    heroAnim.cast = 1;
    queueProj(heroPos(), bossPos(), atk.core, ()=>{
      const bp = bossPos();
      bossAnim.hit = 1; shake = Math.max(shake, 15);
      burst(bp.x, bp.y, atk.core, atk.n);
      burst(bp.x, bp.y, atk.edge, Math.round(atk.n*0.7));
      burst(bp.x, bp.y, '#fff6d0', Math.round(atk.n*0.4));
      shake = Math.max(shake, 12 + atk.ring*4);
      for(let k=0;k<atk.ring;k++){
        rings.push({x:bp.x,y:bp.y,r:6+k*14,max:110+k*45,life:28+k*7,
                    color:k%2?atk.edge:atk.core});
      }
      popup(bp.x, bp.y-84, atk.name, atk.edge, atk.ring>2?22:17);
      rings.push({x:bp.x,y:bp.y,r:10,max:80,life:26,color:'#7cf5c4'});
      if(fx.dmg) popup(bp.x, bp.y-46, '-'+fx.dmg, '#ffd166', 30);
      if(fx.combo > 1) popup(bp.x, bp.y-70, 'COMBO x'+fx.combo, '#ffd166', 17);
    });
    return;
  }
  if(fx.kind === 'counter'){
    bossAnim.lunge = 1;
    queueProj(bossPos(), heroPos(), '#ff5d73', ()=>{
      const hp = heroPos();
      heroAnim.hit = 1; shake = Math.max(shake, 12);
      burst(hp.x, hp.y, '#ff5d73', 34);
      popup(hp.x, hp.y-46, '-14', '#ff5d73', 20);
    });
    return;
  }
  if(fx.kind === 'defeat'){
    bossAnim.dead = 1; deathT = 1; deathBurst = false;
    return;
  }
  if(fx.kind === 'march'){ marchT = 1; travel = 1; travelDir = 1; return; }
  if(fx.kind === 'arrive'){
    deathT = 0; arriveT = 1; shake = Math.max(shake, 16);
    const bp = bossPos();
    burst(bp.x, bp.y+40, 'rgba(255,240,210,0.85)', 26);
    rings.push({x:bp.x,y:bp.y+50,r:10,max:150,life:26,color:'#ffe6b8'});
  }
}

let lastSyncAt = 0;
function applySnapshot(s){
  if(!s || s.at <= lastSyncAt) return;
  lastSyncAt = s.at;
  if(!state.entries.length) return;

  /* a new monster: rebuild the level's look, no sound — the trainer is
     usually listening to the trainee, not to this */
  if(s.idx !== state.idx || s.bossIdx !== state.bossIdx){
    state.idx = Math.min(s.idx, state.entries.length - 1);
    state.bossIdx = s.bossIdx;
    state.boss = BOSSES[state.bossIdx % BOSSES.length];
    bossAnim.dead = 0; bossAnim.hit = 0; bossAnim.lunge = 0;
    deathT = 0; projectiles = []; particles = []; rings = [];
    state.bossShown = s.bossHP;
    arriveT = 1; shake = Math.max(shake, 14);
    state.levelBanner = 1;
  }

  /* The blow itself arrives as an fx event and is already playing; the
     snapshot only has to keep the numbers true. A tiny nudge covers the
     case where an event was lost on the way. */
  if(s.bossHP < state.bossHP && !projectiles.length){
    bossAnim.hit = 1; shake = Math.max(shake, 10);
  }
  if(s.heroHP < state.heroHP && !projectiles.length){
    heroAnim.hit = 1; shake = Math.max(shake, 8);
  }

  state.bossHP = s.bossHP; state.bossMax = s.bossMax || state.bossMax;
  state.bossScale = s.bossScale || 1;
  state.heroHP = s.heroHP; state.heroMax = s.heroMax || 100;
  state.combo = s.combo; state.score = s.score;
  state.cleared = s.cleared; state.attempt = s.attempt;
  state.lastHeard = s.heard || '';
  state.running = s.running; state.busy = s.busy;
  if(s.bossHP <= 0 && !bossAnim.dead){ bossAnim.dead = 1; deathT = 1; }
  if(s.status) setStatus(s.status);
}

/* The mirror has no microphone, no verdict buttons and no keyboard of
   its own: everything it shows arrives from the other device. */
if(MONITOR){
  ['controls','markRow','micHelp'].forEach(function(id){
    const n = document.getElementById(id);
    if(n) n.style.display = 'none';
  });
}

/* Who may mark is stated in the URL, not guessed from whether the page
   sits in a frame. The trainee's screen embeds this game too, so the
   old frame test showed them the very buttons meant for the trainer. */
(function markingVisibility(){
  const row = document.getElementById('markRow');
  if(!row) return;
  const allowed = /[#&]mark=1/.test(location.hash);
  row.style.display = allowed ? '' : 'none';
})();

(function wireMarking(){
  const g = document.getElementById('markGood'), b = document.getElementById('markBad');
  if(g) g.onclick = ()=>markManually(true);
  if(b) b.onclick = ()=>markManually(false);
  /* keyboard is faster than aiming a mouse while talking */
  document.addEventListener('keydown', e=>{
    if(!state.running || state.busy) return;
    if(e.target && /input|textarea/i.test(e.target.tagName)) return;
    if(e.key==='1' || e.key.toLowerCase()==='g'){ e.preventDefault(); markManually(true); }
    if(e.key==='2' || e.key.toLowerCase()==='b'){ e.preventDefault(); markManually(false); }
  });
})();

function setMarkingEnabled(on){
  const g = document.getElementById('markGood'), b = document.getElementById('markBad');
  if(g) g.disabled = !on;
  if(b) b.disabled = !on;
}

function applyResult(pct, heard, entry, manual){
  entry = entry || current();
  const stars = starsFor(pct);
  const why = stars===0 && !manual ? diagnose(entry.word, heard) : null;
  state.results.push({ word:entry.word, pct, stars, rule:entry.rule,
                       isVocab:!!entry.isVocab, meaning:entry.meaning||'',
                       attempts:state.attempt, heard, why, manual:!!manual });
  state.busy = true;
  setMarkingEnabled(false);

  if(stars>0){
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += pct + state.combo*5;
    const dmg = Math.round(state.bossMax * (stars===3?0.36:stars===2?0.28:0.2) + state.combo*1.5);
    const atk = attackFor(state.combo, stars);
    heroAnim.cast = 1;
    setStatus(manual ? '✓ Marked good — nice one.'
            : stars===3? '⭐⭐⭐ Perfect — '+pct+'%'
            : stars===2? '⭐⭐ Good — '+pct+'%. '+entry.rule.tip
            : '⭐ Close — '+pct+'%. '+entry.rule.tip);
    sfx('hit');
    /* the mirror strikes the same blow at the same moment */
    emitFx({ kind:'attack', combo:state.combo, stars:stars, dmg:dmg });
    setTimeout(()=>{
      queueProj(heroPos(), bossPos(), atk.core, ()=>{
        state.bossHP = Math.max(0, state.bossHP-dmg);
        bossAnim.hit=1; shake=15;
        burst(bossPos().x,bossPos().y,atk.core,atk.n);
        burst(bossPos().x,bossPos().y,atk.edge,Math.round(atk.n*0.7));
        burst(bossPos().x,bossPos().y,'#fff6d0',Math.round(atk.n*0.4));
        shake=Math.max(shake,12+atk.ring*4);
        for(let k=0;k<atk.ring;k++){
          rings.push({x:bossPos().x,y:bossPos().y,r:6+k*14,max:110+k*45,life:28+k*7,
                      color:k%2?atk.edge:atk.core});
        }
        popup(bossPos().x,bossPos().y-84,atk.name,atk.edge,atk.ring>2?22:17);
        sfx(atk.sound);
        rings.push({x:bossPos().x,y:bossPos().y,r:10,max:80,life:26,color:'#7cf5c4'});
        popup(bossPos().x,bossPos().y-46,'-'+dmg,'#ffd166',30);
        if(state.combo>1) popup(bossPos().x,bossPos().y-70,'COMBO x'+state.combo,'#ffd166',17);
        advance();
      });
    },170);
  }else{
    state.combo = 0;
    bossAnim.lunge = 1;
    setStatus(manual
      ? '✗ Marked needs work. '+entry.rule.tip
      : '❌ '+pct+'% — heard "<b>'+ (heard||'…') +'</b>". '+(why||entry.rule.tip));
    sfx('miss');
    emitFx({ kind:'counter' });
    setTimeout(()=>{
      queueProj(bossPos(), heroPos(), '#ff5d73', ()=>{
        state.heroHP = Math.max(0, state.heroHP-7);
        heroAnim.hit=1; shake=11;
        burst(heroPos().x,heroPos().y,'#ff5d73',34); shake=Math.max(shake,12);
        popup(heroPos().x,heroPos().y-46,'-14','#ff5d73',20);
        advance();
      });
    },170);
  }
}

/* Set up the level for whatever word state.idx now points at: a new
   monster, full health, a fresh arena and a banner. */
function startLevel(announce){
  state.attempt = 0; state.bestPct = 0; state.lastHeard = '';
  state.boss = BOSSES[state.bossIdx % BOSSES.length];
  /* each level is tougher than the last: more health, and the monster
     itself looms larger on screen */
  const step = state.idx;
  state.bossHP = state.bossMax = Math.round(state.boss.hp * (1 + step*0.16));
  state.bossScale = 1 + Math.min(0.45, step*0.05);
  state.bossShown = state.bossHP;
  bossAnim.dead = 0; bossAnim.hit = 0; bossAnim.lunge = 0;
  projectiles = []; particles = []; rings = [];
  state.levelBanner = announce ? 1 : 0;
  micBtn.classList.remove('retry');
  const pb = document.getElementById('playbackBtn'); if(pb) pb.disabled = true;
  lastBlob = null;
  setMarkingEnabled(true);
  setStatus('Level ' + (state.idx+1) + ' of ' + state.entries.length +
            ' — <b>' + state.boss.name + '</b>. Say <b>' + current().word + '</b>.');
}

function advance(){
  state.busy = false;

  if(state.heroHP<=0){ state.running=false;
    setTimeout(()=>showResults(false), 700); return; }

  /* A defeated monster ends this word's level rather than the round. */
  if(state.bossHP<=0){
    bossAnim.dead = 1;
    state.cleared = (state.cleared||0) + 1;
    if(state.idx >= state.entries.length-1){
      state.running = false;
      setTimeout(()=>showResults(true), 950);
      return;
    }
    state.busy = true;
    setMarkingEnabled(false);
    setStatus('<b>' + state.boss.name + '</b> defeated!');

    /* beat one: the monster comes apart */
    deathT = 1; deathBurst = false;
    sfx('win');
    emitFx({ kind:'defeat' });

    setTimeout(()=>{
      /* beat two: the hero marches out and the arena slides past */
      setStatus('Marching on…');
      marchT = 1;
      travel = 1; travelDir = 1;
      emitFx({ kind:'march' });

      setTimeout(()=>{
        /* beat three: the next monster lands */
        state.idx++;
        state.bossIdx++;
        state.busy = false;
        deathT = 0;
        startLevel(true);
        arriveT = 1;
        shake = Math.max(shake, 16);
        sfx('land');
        emitFx({ kind:'arrive' });
        const bp = bossPos();
        burst(bp.x, bp.y+40, 'rgba(255,240,210,0.85)', 26);
        rings.push({x:bp.x,y:bp.y+50,r:10,max:150,life:26,color:'#ffe6b8'});
      }, 900);
    }, 1050);
    return;
  }

  /* Monster still standing: same word, same level, go again. */
  state.attempt = 0; state.bestPct = 0; state.lastHeard='';
  micBtn.classList.remove('retry');
  const pb = document.getElementById('playbackBtn'); if(pb) pb.disabled = true;
  lastBlob = null;
  setMarkingEnabled(true);
  setStatus('Say <b>'+current().word+'</b> again — ' + Math.max(1,Math.round(state.bossHP)) + ' left on ' + state.boss.name + '.');
}

/* reference pronunciation + self playback */
function speak(rate){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(current().word);
    u.lang='en-US'; u.rate=rate;
    const v = speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.getElementById('listenBtn').onclick = ()=>speak(0.95);
document.getElementById('slowBtn').onclick   = ()=>speak(0.55);
document.getElementById('playbackBtn').onclick = ()=>{
  if(!lastBlob) return;
  const a = new Audio(URL.createObjectURL(lastBlob));
  a.play().catch(()=>{});
};

/* ============================================================
   RESULTS
   ============================================================ */
function showResults(won){
  const list = document.getElementById('resultsList');
  const avg = state.results.length
    ? Math.round(state.results.reduce((s,r)=>s+r.pct,0)/state.results.length) : 0;
  document.getElementById('resultsTitle').textContent =
    won ? state.boss.name+' Defeated!' : 'Round Over';
  document.getElementById('resultsSub').innerHTML =
    'Average accuracy <b style="color:var(--accent)">'+avg+'%</b> · '+
    'Score '+state.score+' · Best combo x'+state.bestCombo;
  list.innerHTML = '';

  const rowFor = r=>{
    const col = r.pct>=88?'#7cf5c4' : r.pct>=72?'#ffd166' : r.pct>=52?'#ffa94d':'#ff5d73';
    const note = r.why ? r.why : (r.rule.name+' — '+r.rule.tip);
    const tries = r.attempts>1 ? ' <span style="opacity:.65">('+r.attempts+' tries)</span>' : '';
    const row=document.createElement('div'); row.className='wordRow';
    row.innerHTML =
      '<span class="w">'+r.word+'</span>'+
      '<span class="stars" style="color:'+col+'">'+'★'.repeat(r.stars)+'☆'.repeat(3-r.stars)+'</span>'+
      '<span class="tip">'+note+tries+
        (r.meaning?'<br><i style="opacity:.75">'+r.meaning+'</i>':'')+'</span>'+
      '<span class="pct" style="color:'+col+'">'+r.pct+'%</span>';
    return row;
  };
  const heading = txt=>{
    const h=document.createElement('div');
    h.style.cssText='font-size:11px;letter-spacing:1px;text-transform:uppercase;'+
      'color:var(--muted);font-weight:700;margin:14px 0 7px;';
    h.textContent=txt; return h;
  };

  const drill = state.results.filter(r=>!r.isVocab);
  const vocab = state.results.filter(r=>r.isVocab);

  if(drill.length){
    list.appendChild(heading('Pronunciation drill'));
    drill.forEach(r=>list.appendChild(rowFor(r)));
  }

  if(vocab.length){
    const mastered = vocab.filter(r=>r.stars>=2);
    list.appendChild(heading('Session vocabulary — '+mastered.length+' of '+vocab.length+' pronounced correctly'));
    vocab.forEach(r=>list.appendChild(rowFor(r)));

    const still = vocab.filter(r=>r.stars<2).map(r=>r.word);
    const box=document.createElement('div');
    box.style.cssText='margin-top:12px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.5;'+
      (still.length
        ? 'background:rgba(255,169,77,0.10);border:1px solid rgba(255,169,77,0.4);'
        : 'background:rgba(124,245,196,0.10);border:1px solid rgba(124,245,196,0.4);');
    box.innerHTML = still.length
      ? '<b style="color:#ffa94d">Still to practise:</b> '+still.join(', ')
      : '<b style="color:var(--accent)">All session vocabulary pronounced correctly.</b>';
    list.appendChild(box);
  }

  state.bossIdx++;
  showScreen('screenResults');
  reportToTrainer(won, avg);
}

/* When this game is embedded in Entk Session Trainer, hand the
   round back to the parent so the feedback note can quote it.
   Standalone, the parent is this window and nothing listens. */
function reportToTrainer(won, avg){
  if(window.parent === window) return;
  try{
    window.parent.postMessage({
      source:'antoch-game', game:'pronunciation',
      won:!!won, average:avg, score:state.score, bestCombo:state.bestCombo,
      results: state.results.map(r=>({word:r.word, pct:r.pct, stars:r.stars,
        attempts:r.attempts, heard:r.heard||'', isVocab:!!r.isVocab, manual:!!r.manual}))
    }, '*');
  }catch(e){}
}

/* ============================================================
   EFFECTS HELPERS
   ============================================================ */
function makeProj(from,to,color,onArrive){
  return {x:from.x,y:from.y,fx:from.x,fy:from.y,tx:to.x,ty:to.y,t:0,color,onArrive,spin:0};
}

/* Fire a projectile whose effect is guaranteed to land.
   The animation advances on requestAnimationFrame, which the browser
   stops entirely while the tab is hidden — and during a screen-shared
   lesson the trainer alt-tabs constantly. Without a wall-clock
   fallback the round would sit frozen mid-attempt, marking disabled,
   until somebody noticed. Timers keep running when frames do not. */
function queueProj(from,to,color,onArrive,timeoutMs){
  let fired = false;
  const fire = ()=>{ if(fired) return; fired = true; onArrive(); };
  const p = makeProj(from,to,color,fire);
  p.trail = color;
  projectiles.push(p);
  setTimeout(()=>{
    if(fired) return;
    const i = projectiles.indexOf(p);
    if(i>=0) projectiles.splice(i,1);
    fire();
  }, timeoutMs || 1500);
  return p;
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1.2+Math.random()*4.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:36,max:36,color,r:1.6+Math.random()*2.6});
  }
}
function popup(x,y,text,color,size){ popups.push({x,y,text,color,size:size||18,life:56,max:56}); }

/* ============================================================
   BACKGROUND — layered, animated night arena
   ============================================================ */
const stars = Array.from({length:120},()=>({x:Math.random()*W,y:15+Math.random()*250,
  r:0.4+Math.random()*1.6,seed:Math.random()*10}));
const farHills = (()=>{const a=[];let x=-40;while(x<W+40){a.push({x,w:120+Math.random()*180,h:50+Math.random()*70});x+=90+Math.random()*90;}return a;})();
const towers = (()=>{const a=[];let x=-30;while(x<W+30){const w=24+Math.random()*44,h=70+Math.random()*150;
  a.push({x,w,h,roof:16+Math.random()*22,lit:Math.random()<0.7});x+=w+12+Math.random()*34;}return a;})();
const motes = Array.from({length:34},()=>({x:Math.random()*W,y:Math.random()*H,
  r:0.9+Math.random()*2.3,sp:0.12+Math.random()*0.4,drift:(Math.random()-0.5)*0.35,
  seed:Math.random()*10,hue:Math.random()<0.5?150:45}));
/* ---- reading-room scene data, generated once ---- */
/* Each monster gets its own atmosphere. The room's structure is
   reused — shelf band, ground plane, light pool — but repainted, which
   gives four distinct places for the cost of a palette. */
const SCENES = [
  { id:'library', wall:['#3a2415','#5a3a22','#2a1a0f'], ground:['#8a5a30','#7a4d28','#4a2c15'],
    light:'255,214,140', band:'shelf' },
  { id:'forest',  wall:['#0f2417','#1c4429','#08170e'], ground:['#3f5a2a','#354d22','#1d2c12'],
    light:'190,255,170', band:'trees' },
  { id:'desert',  wall:['#4a3312','#8a6524','#2e2009'], ground:['#c9a05a','#b88b45','#6d4f22'],
    light:'255,226,150', band:'dunes' },
  { id:'sky',     wall:['#10243f','#27466f','#0a1526'], ground:['#3d5f86','#33506f','#1a2b40'],
    light:'180,215,255', band:'clouds' }
];
function scene(){ return SCENES[(state.bossIdx||0) % SCENES.length]; }

const shelves = (()=>{
  const tiers=[{y:40,h:78,alpha:0.42},{y:150,h:86,alpha:0.62},{y:262,h:92,alpha:0.85}];
  return tiers.map(tier=>{
    const books=[]; let x=-14;
    while(x<W+14){
      const w=13+Math.random()*22;
      books.push({x, w, h:tier.h*(0.62+Math.random()*0.38),
        hue:[22,14,32,8,40,200,150][Math.floor(Math.random()*7)],
        l:22+Math.random()*16, lean:Math.random()<0.12?(Math.random()-0.5)*0.16:0});
      x+=w+2+Math.random()*3;
    }
    return {y:tier.y,h:tier.h,alpha:tier.alpha,books};
  });
})();
const grain = Array.from({length:16},()=>({y:392+Math.random()*200,
  a:6+Math.random()*22, b:(Math.random()-0.5)*26}));
const dust = Array.from({length:40},()=>({x:Math.random()*W, y:Math.random()*380,
  r:0.7+Math.random()*1.8, s:0.3+Math.random()*0.7, p:Math.random()*7}));
let shooting = null, shootTimer = 220;

/* Travel runs 1 -> 0 while the arena slides past and the hero walks to
   the next fight. Driven by the render loop, but the level change
   itself is on a timer, so a hidden tab never strands the round. */
let travel = 0;
let travelDir = 1;
let deathT = 0;      /* 0 -> 1 as the beaten monster comes apart      */
let marchT = 0;      /* 0 -> 1 while the hero strides to the next one */
let arriveT = 0;     /* 0 -> 1 as the next monster lands              */
let deathBurst = false;

/* Attacks escalate with the combo rather than always being the same
   bolt: a clean run visibly hits harder than a first attempt. */
const ATTACKS = [
  { name:'SPARK',    core:'#ffd166', edge:'#ff8a3c', n:26, ring:1, sound:'hit'   },
  { name:'FLAME',    core:'#ff9a3c', edge:'#ff5722', n:40, ring:2, sound:'flame' },
  { name:'FIREBALL', core:'#ff7a1f', edge:'#ffd166', n:56, ring:3, sound:'flame' },
  { name:'INFERNO',  core:'#fff3c8', edge:'#ff3d00', n:78, ring:4, sound:'blast' }
];
function attackFor(combo, stars){
  let tier = 0;
  if(stars>=2) tier++;
  if(combo>=2) tier++;
  if(combo>=4) tier++;
  return ATTACKS[Math.min(ATTACKS.length-1, tier)];
}
function camX(){
  /* ease out, so the scene decelerates into the new arena */
  const p = 1 - travel;
  const e = 1 - Math.pow(1 - p, 3);
  return (1 - e) * W * 1.15 * travelDir;
}

function drawBackground(t){
  /* A reading room rather than a night arena: warm paper light, a wall
     of books behind, and a desk surface the characters stand on. Canvas
     is good at wood, paper and bevels — far better than at faces — so
     the art leans on what the medium actually does well. */
  const SC=scene();
  const wall=ctx.createLinearGradient(0,0,0,H);
  wall.addColorStop(0,SC.wall[0]);
  wall.addColorStop(0.52,SC.wall[1]);
  wall.addColorStop(1,SC.wall[2]);
  ctx.fillStyle=wall; ctx.fillRect(-W,0,W*3,H);

  /* hanging lamp glow, top centre */
  const lamp=ctx.createRadialGradient(W/2,-40,20,W/2,-40,460);
  lamp.addColorStop(0,'rgba('+SC.light+',0.55)');
  lamp.addColorStop(1,'rgba('+SC.light+',0)');
  ctx.fillStyle=lamp; ctx.fillRect(-W,0,W*3,H);

  /* bookshelves: three tiers of spines receding into shadow */
  if(SC.band!=='shelf'){
    shelves.forEach((shelf,ti)=>{
      ctx.save(); ctx.globalAlpha=shelf.alpha*0.85;
      shelf.books.forEach(b=>{
        const bx=b.x, base=shelf.y+shelf.h, hh=b.h;
        ctx.beginPath();
        if(SC.band==='trees'){
          ctx.moveTo(bx-b.w*0.9, base);
          ctx.lineTo(bx, base-hh*1.5);
          ctx.lineTo(bx+b.w*0.9, base);
        }else if(SC.band==='dunes'){
          ctx.moveTo(bx-b.w*1.4, base);
          ctx.quadraticCurveTo(bx, base-hh*0.55, bx+b.w*1.4, base);
        }else{
          ctx.arc(bx, base-hh*0.35, b.w*0.9, 0, Math.PI*2);
        }
        ctx.closePath();
        ctx.fillStyle = SC.band==='clouds'
          ? 'rgba(255,255,255,0.13)'
          : 'hsl('+(SC.band==='trees'?120:36)+',30%,'+(10+ti*5)+'%)';
        ctx.fill();
      });
      ctx.restore();
    });
  } else shelves.forEach(shelf=>{
    ctx.save();
    ctx.globalAlpha=shelf.alpha;
    /* shelf plank */
    ctx.fillStyle='#2e1c10';
    ctx.fillRect(-W,shelf.y+shelf.h,W*3,9);
    ctx.fillStyle='rgba(255,214,140,0.10)';
    ctx.fillRect(-W,shelf.y+shelf.h,W*3,2);
    shelf.books.forEach(b=>{
      const lean=b.lean;
      ctx.save();
      ctx.translate(b.x,shelf.y+shelf.h);
      ctx.rotate(lean);
      const g=ctx.createLinearGradient(0,-b.h,b.w,-b.h);
      g.addColorStop(0,'hsl('+b.hue+',34%,'+(b.l+9)+'%)');
      g.addColorStop(0.5,'hsl('+b.hue+',38%,'+b.l+'%)');
      g.addColorStop(1,'hsl('+b.hue+',34%,'+(b.l-10)+'%)');
      ctx.fillStyle=g;
      ctx.fillRect(0,-b.h,b.w,b.h);
      /* gold bands on the spine */
      ctx.fillStyle='rgba(233,195,116,0.5)';
      ctx.fillRect(0,-b.h+b.h*0.18,b.w,1.6);
      ctx.fillRect(0,-b.h+b.h*0.72,b.w,1.6);
      ctx.restore();
    });
    ctx.restore();
  });

  /* desk surface */
  const deskY=384;
  const desk=ctx.createLinearGradient(0,deskY,0,H);
  desk.addColorStop(0,SC.ground[0]);
  desk.addColorStop(0.12,SC.ground[1]);
  desk.addColorStop(1,SC.ground[2]);
  ctx.fillStyle=desk; ctx.fillRect(-W,deskY,W*3,H-deskY);

  /* front edge highlight */
  ctx.fillStyle='rgba(255,214,140,0.22)';
  ctx.fillRect(-W,deskY,W*3,3);

  /* wood grain */
  ctx.save();
  ctx.globalAlpha=0.16;
  ctx.strokeStyle='#311c0c'; ctx.lineWidth=1.4;
  grain.forEach(g=>{
    ctx.beginPath();
    ctx.moveTo(-20,g.y);
    ctx.bezierCurveTo(W*0.3,g.y+g.a,W*0.7,g.y-g.a,W+20,g.y+g.b);
    ctx.stroke();
  });
  ctx.restore();

  /* warm pool of light on the desk between the two characters */
  const pool=ctx.createRadialGradient(W/2,deskY+90,30,W/2,deskY+90,430);
  pool.addColorStop(0,'rgba('+SC.light+',0.20)');
  pool.addColorStop(1,'rgba('+SC.light+',0)');
  ctx.fillStyle=pool; ctx.fillRect(-W,deskY,W*3,H-deskY);

  /* dust in the lamplight */
  dust.forEach(m=>{
    const yy=m.y+Math.sin(t*m.s+m.p)*14;
    ctx.globalAlpha=0.10+Math.sin(t*m.s*1.4+m.p)*0.07;
    ctx.beginPath(); ctx.arc(m.x,yy,m.r,0,Math.PI*2);
    ctx.fillStyle='#ffe6b8'; ctx.fill();
  });
  ctx.globalAlpha=1;
}

function runeCircle(cx,cy,r,color,t){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,0.33); ctx.globalAlpha=0.5;
  for(let i=0;i<2;i++){
    ctx.beginPath(); ctx.arc(0,0,r-i*15,0,Math.PI*2);
    ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.shadowColor=color; ctx.shadowBlur=15; ctx.stroke();
  }
  ctx.rotate(t*0.45);
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2;
    ctx.moveTo(Math.cos(a)*(r-4),Math.sin(a)*(r-4));
    ctx.lineTo(Math.cos(a)*(r-23),Math.sin(a)*(r-23));
  }
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0; ctx.restore(); ctx.globalAlpha=1;
}

function vignette(){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.88);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=g; ctx.fillRect(-30,-30,W+60,H+60);
}

/* ============================================================
   HERO — the Sentence Seeker
   ============================================================ */
/* ============================================================
   SPRITE ART
   Characters are generated artwork rather than canvas paths. The
   procedural versions are kept below as a fallback so the game still
   runs if an image is missing or has not loaded yet.
   ============================================================ */
const SPR = {};
['hero','boss-01-inkblot','boss-02-dictionary','boss-03-tiles','boss-04-typewriter',
 'boss-05-scroll','boss-06-quillbird','boss-07-glue'].forEach(n=>{
  const img = new Image();
  img.src = 'sprites/' + n + '.png';
  SPR[n] = img;
});
function sprite(name){
  const img = SPR[name];
  return (img && img.complete && img.naturalWidth) ? img : null;
}
/* drawn at a fixed height so wildly different source crops still sit
   consistently on the desk */
function drawSprite(img, h){
  const w = img.naturalWidth / img.naturalHeight * h;
  ctx.drawImage(img, -w/2, -h, w, h);
}

function drawHero(t){
  const p=heroPos(), bob=Math.sin(heroAnim.bob)*4.5, lunge=heroAnim.cast*26;
  ctx.save();
  ctx.translate(p.x+lunge,p.y+bob);
  if(heroAnim.hit>0.05) ctx.translate((Math.random()-0.5)*heroAnim.hit*11,(Math.random()-0.5)*heroAnim.hit*11);

  ctx.beginPath(); ctx.ellipse(0,80,46,11,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();

  const heroImg = sprite('hero');
  if(heroImg){
    /* A march rather than a bob: the hero leans into the walk, rises
       and falls on each stride, and kicks up dust at every footfall. */
    if(marchT>0 || travel>0){
      const step = Math.sin(t*13);
      /* Walk out to the right, towards where the next monster will
         stand. A 24px shuffle was too small to read as walking. */
      const gone = 1 - Math.max(marchT, travel);
      ctx.translate(300 * gone, -Math.abs(step)*13);
      ctx.rotate(step*0.08 + 0.06);
      if(Math.abs(step) > 0.97 && Math.random() < 0.4){
        const hp = heroPos();
        burst(hp.x-18, hp.y+74, 'rgba(255,240,210,0.9)', 4);
      }
    }
    if(heroAnim.hit>0.05){ ctx.globalAlpha = 0.55 + Math.random()*0.45; }
    ctx.save();
    ctx.translate(0,84);
    const squash = 1 + heroAnim.cast*0.06;
    ctx.scale(1/squash, squash);
    ctx.scale(-1, 1);          // face right, towards the monster
    drawSprite(heroImg, 176);
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }

  // owl familiar
  ctx.save();
  const wing=Math.sin(t*4)*0.5;
  ctx.translate(-52,-66+Math.sin(heroAnim.bob*1.4)*4);
  ctx.save(); ctx.rotate(-wing);
  ctx.beginPath(); ctx.ellipse(-13,0,9,5,0.4,0,Math.PI*2); ctx.fillStyle='#c9a35a'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(wing);
  ctx.beginPath(); ctx.ellipse(13,0,9,5,-0.4,0,Math.PI*2); ctx.fillStyle='#c9a35a'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.ellipse(0,0,12,14,0,0,Math.PI*2); ctx.fillStyle='#ece4d6'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-9,-11); ctx.lineTo(-5,-19); ctx.lineTo(-1,-10); ctx.closePath();
  ctx.moveTo(9,-11); ctx.lineTo(5,-19); ctx.lineTo(1,-10); ctx.closePath();
  ctx.fillStyle='#c9a35a'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-2,4,0,Math.PI*2); ctx.arc(4,-2,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1a10'; ctx.beginPath(); ctx.arc(-4,-2,2.2,0,Math.PI*2); ctx.arc(4,-2,2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.moveTo(-2.5,3); ctx.lineTo(2.5,3); ctx.lineTo(0,8); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* Cape: a full drape hanging from both shoulders with a wavy hem,
     drawn behind the body. The previous version was a narrow strip
     down one side only, which read as a red smear rather than cloth. */
  ctx.beginPath();
  ctx.moveTo(-19,-30);
  ctx.quadraticCurveTo(-40,-6,-37,26);
  for(let i=0;i<=5;i++){
    const px=-37+i*15, py=54+Math.sin(t*2.1+i*0.7)*6;
    ctx.quadraticCurveTo(px+4, py+9, px+15, py);
  }
  ctx.quadraticCurveTo(40,26,37,-6);
  ctx.quadraticCurveTo(34,-24,19,-30);
  ctx.quadraticCurveTo(0,-24,-19,-30);
  ctx.closePath();
  const cg=ctx.createLinearGradient(-30,-30,26,60);
  cg.addColorStop(0,'#ff8296'); cg.addColorStop(0.5,'#c8405e'); cg.addColorStop(1,'#6d1d38');
  ctx.fillStyle=cg; ctx.fill();
  /* fold lines give the cloth some volume */
  ctx.strokeStyle='rgba(60,10,30,0.35)'; ctx.lineWidth=2; ctx.lineCap='round';
  [-20,-6,10,24].forEach((fx,i)=>{
    ctx.beginPath(); ctx.moveTo(fx*0.55,-22);
    ctx.quadraticCurveTo(fx+Math.sin(t*1.8+i)*2, 20, fx*1.12, 52);
    ctx.stroke();
  });
  /* collar clasp */
  ctx.fillStyle='#ffd166';
  ctx.beginPath(); ctx.arc(-14,-30,3.6,0,Math.PI*2); ctx.arc(14,-30,3.6,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#3a2c22';
  ctx.beginPath(); ctx.roundRect(-15,46,11,28,4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(5,46,11,28,4); ctx.fill();
  ctx.fillStyle='#241a14';
  ctx.beginPath(); ctx.roundRect(-18,70,16,7,3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(4,70,16,7,3); ctx.fill();

  // robe
  ctx.beginPath();
  ctx.moveTo(-21,-8); ctx.lineTo(21,-8); ctx.lineTo(28,52); ctx.lineTo(-28,52); ctx.closePath();
  const rg=ctx.createLinearGradient(0,-8,0,52);
  rg.addColorStop(0,'#3a4a7e'); rg.addColorStop(1,'#141e3e');
  ctx.fillStyle=rg; ctx.fill();
  ctx.strokeStyle='rgba(255,209,102,0.85)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-21,14); ctx.lineTo(26,14); ctx.stroke();
  ctx.strokeStyle='rgba(255,209,102,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-3,14); ctx.lineTo(-3,52); ctx.stroke();

  // spellbook
  ctx.save();
  ctx.translate(24,10); ctx.rotate(-0.32-heroAnim.cast*0.5);
  const gl=18+heroAnim.cast*22;
  const gg=ctx.createRadialGradient(0,0,2,0,0,gl+16);
  gg.addColorStop(0,'rgba(124,245,196,'+(0.5+heroAnim.cast*0.4)+')');
  gg.addColorStop(1,'rgba(124,245,196,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,gl+16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c9962e'; ctx.beginPath(); ctx.roundRect(-15,-12,30,24,3); ctx.fill();
  ctx.fillStyle='#f6ecd2'; ctx.beginPath(); ctx.roundRect(-13,-10,12,20,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(1,-10,12,20,2); ctx.fill();
  ctx.strokeStyle='#a9781f'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,12); ctx.stroke();
  ctx.fillStyle='#7cf5c4'; ctx.font='700 11px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('AB',-7,1); ctx.fillText('C',7,1);
  // orbiting runes while casting
  for(let i=0;i<3;i++){
    const a=t*3+i*2.1, rr=22+heroAnim.cast*14;
    ctx.globalAlpha=0.45+heroAnim.cast*0.5;
    ctx.fillStyle='#7cf5c4';
    ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr*0.6,2.4,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  ctx.strokeStyle='#1b2748'; ctx.lineWidth=10; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(14,2); ctx.lineTo(24,14); ctx.stroke();

  // head
  ctx.beginPath(); ctx.ellipse(2,-28,19,20,0,0,Math.PI*2);
  const hg=ctx.createRadialGradient(-5,-35,4,2,-28,24);
  hg.addColorStop(0,'#ffdcbb'); hg.addColorStop(1,'#e0a06a');
  ctx.fillStyle=hg; ctx.fill();
  ctx.fillStyle='#e8b98d';
  ctx.beginPath(); ctx.ellipse(-16,-27,4,6,0,0,Math.PI*2); ctx.fill();

  // hair
  ctx.fillStyle='#33200f';
  ctx.beginPath();
  ctx.moveTo(-18,-33);
  ctx.quadraticCurveTo(-6,-56,15,-45);
  ctx.quadraticCurveTo(25,-40,20,-30);
  ctx.quadraticCurveTo(12,-43,1,-36);
  ctx.quadraticCurveTo(-8,-43,-18,-33);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(12,-44); ctx.quadraticCurveTo(24,-50,22,-38);
  ctx.quadraticCurveTo(18,-44,12,-44); ctx.closePath(); ctx.fill();

  // face
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-5,-27,4.2,3.4,0,0,Math.PI*2);
  ctx.ellipse(8,-27,4.2,3.4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1a3e';
  ctx.beginPath(); ctx.arc(-4.4,-27,2.3,0,Math.PI*2); ctx.arc(8.6,-27,2.3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#33200f'; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-9,-33); ctx.lineTo(-1,-34);
  ctx.moveTo(5,-34); ctx.lineTo(13,-33); ctx.stroke();
  ctx.strokeStyle='#a35c38'; ctx.lineWidth=1.7;
  ctx.beginPath(); ctx.arc(2,-20,5.5,0.12*Math.PI,0.88*Math.PI); ctx.stroke();

  ctx.restore();
}

/* ============================================================
   BOSSES
   ============================================================ */
/* Three stops instead of two: a lit shoulder, the body colour, and a
   shadowed underside. Two stops read as a flat blob, which is exactly
   how the first boss looked — an egg. */
function bfill(hue,s1,l1,s2,l2){
  const g=ctx.createRadialGradient(-26,-26,8,0,22,96);
  g.addColorStop(0, bossAnim.hit>0.1?'#fff':'hsl('+hue+','+s1+'%,'+Math.min(92,l1+16)+'%)');
  g.addColorStop(0.42, bossAnim.hit>0.1?'#ffd9de':'hsl('+hue+','+s1+'%,'+l1+'%)');
  g.addColorStop(1,'hsl('+hue+','+s2+'%,'+Math.max(6,l2-6)+'%)');
  return g;
}

/* A rim light along one edge is what separates a character from the
   background. Call after filling a shape, with the path still known. */
function rimLight(hue,alpha){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  ctx.strokeStyle='hsla('+hue+',90%,72%,'+(alpha||0.5)+')';
  ctx.lineWidth=2.5;
  ctx.stroke();
  ctx.restore();
}

/* Eyes carry almost all of a creature's character. A glowing dot has
   none; a sclera with an iris, a pupil and a specular highlight reads
   as something looking back at you. */
function eye(x,y,r,hue,opts){
  const o=opts||{};
  const hit=bossAnim.hit>0.1;
  const lookX=Math.cos(bossAnim.bob*0.6)*r*0.14;

  ctx.beginPath(); ctx.arc(x,y,r+5,0,Math.PI*2);
  ctx.fillStyle='#0a0418'; ctx.fill();

  const sg=ctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.2,x,y,r);
  sg.addColorStop(0,'#ffffff');
  sg.addColorStop(1, hit?'#ffc9d1':'hsl('+hue+',48%,86%)');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();

  const ir=r*0.62;
  ctx.beginPath(); ctx.arc(x+lookX,y,ir,0,Math.PI*2);
  ctx.fillStyle= hit?'#ff5d73':'hsl('+hue+',88%,44%)';
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0;

  ctx.beginPath();
  if(o.slit) ctx.ellipse(x+lookX,y,ir*0.32,ir*0.86,0,0,Math.PI*2);
  else ctx.arc(x+lookX,y,ir*0.52,0,Math.PI*2);
  ctx.fillStyle='#0b0316'; ctx.fill();

  ctx.beginPath(); ctx.arc(x-r*0.32,y-r*0.36,r*0.24,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.fill();
}
function fangs(y,hw,n){
  ctx.beginPath(); ctx.moveTo(-hw,y);
  for(let i=0;i<n;i++) ctx.lineTo(-hw+(i+1)*(hw*2/n), y+(i%2===0?10:0));
  ctx.closePath(); ctx.fillStyle='#12061f'; ctx.fill();
}

function drawBoss(t){
  const p=bossPos(), b=state.boss, hue=b.hue;
  const bob=Math.sin(bossAnim.bob)*6, lunge=-bossAnim.lunge*30;
  const sc=1-bossAnim.dead*0.92, fade=1-bossAnim.dead;
  ctx.save(); ctx.globalAlpha=fade;
  ctx.translate(p.x+lunge,p.y+bob); ctx.scale(sc,sc);
  if(bossAnim.hit>0.05) ctx.translate((Math.random()-0.5)*bossAnim.hit*16,(Math.random()-0.5)*bossAnim.hit*16);

  ctx.beginPath(); ctx.ellipse(0,100,68,15,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();

  const bossImg = b.art ? sprite(b.art) : null;
  if(bossImg){
    /* Defeat: stagger, tip over, break apart. The particles are thrown
       once rather than every frame, or the burst would never thin out. */
    if(deathT>0){
      const p = 1-deathT;
      ctx.globalAlpha *= Math.max(0, 1-p*1.15);
      ctx.rotate(p*0.9);
      ctx.translate(Math.sin(deathT*40)*10*deathT, p*70);
      ctx.scale(1+p*0.15, 1-p*0.35);
      if(!deathBurst){
        deathBurst = true;
        const bp = bossPos();
        burst(bp.x, bp.y-40, '#ffd166', 60);
        burst(bp.x, bp.y-40, '#ff8a3c', 44);
        burst(bp.x, bp.y-40, '#fff6d0', 30);
        rings.push({x:bp.x,y:bp.y-30,r:8,max:190,life:40,color:'#ffd166'});
        shake = Math.max(shake, 22);
      }
    }
    /* Arrival: land hard, with a squash and a thump of dust. */
    if(arriveT>0){
      const a=arriveT;
      ctx.translate(0, -a*a*220);
      ctx.scale(1+a*0.12, 1-a*0.12);
    }
    if(travel>0){ ctx.globalAlpha *= Math.max(0, 1-travel*1.4); }
    if(bossAnim.hit>0.05) ctx.globalAlpha *= 0.5 + Math.random()*0.5;
    ctx.save();
    ctx.translate(0,104);
    const breathe = 1 + Math.sin(t*1.6)*0.02;
    ctx.scale(1/breathe, breathe);
    drawSprite(bossImg, 208 * (state.bossScale||1));
    ctx.restore();
    ctx.restore();
    return;
  }

  switch(b.type){
    case 'wraith': {
      ctx.globalAlpha*=0.96;
      const sway=Math.sin(t*1.6)*5;

      /* Sleeves first, so the robe overlaps them and the arms read as
         coming from inside the garment rather than stuck on top. */
      ctx.fillStyle='hsl('+hue+',44%,20%)';
      [-1,1].forEach(s=>{
        ctx.beginPath();
        ctx.moveTo(s*20,-8);

function hpBar(x,y,w,h,pct,cols,label){
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.roundRect(-3,-3,w+6,h+6,(h+6)/2);
  ctx.fillStyle='rgba(10,4,24,0.75)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.roundRect(0,0,w,h,h/2);
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fill();
  const fw=Math.max(0,Math.min(1,pct))*w;
  if(fw>0){
    ctx.save(); ctx.beginPath(); ctx.roundRect(0,0,fw,h,h/2); ctx.clip();
    const g=ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0,cols[0]); g.addColorStop(1,cols[1]);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(0,0,w,h*0.42);
    ctx.restore();
  }
  for(let i=1;i<5;i++){ ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(w*i/5,0); ctx.lineTo(w*i/5,h); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.font='700 12px Segoe UI';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=4;
  ctx.fillText(label,8,h/2+0.5); ctx.shadowBlur=0;
  ctx.restore();
}

/* One chunky letter tile, in the manner of a wooden word game piece:
   bevelled face, warm ivory, deep serif letter, and a shadow that
   makes it sit on the desk rather than float above it. */
function drawTile(x,y,size,ch,opts){
  const o=opts||{};
  const r=size*0.16;
  ctx.save();
  ctx.translate(x,y);
  if(o.rot) ctx.rotate(o.rot);

  ctx.beginPath(); ctx.roundRect(-size/2+2,-size/2+5,size,size,r);
  ctx.fillStyle='rgba(40,20,8,0.38)'; ctx.fill();

  ctx.beginPath(); ctx.roundRect(-size/2,-size/2,size,size,r);
  const face=ctx.createLinearGradient(-size/2,-size/2,size/2,size/2);
  if(o.hot){ face.addColorStop(0,'#fff3c8'); face.addColorStop(1,'#f2c86a'); }
  else { face.addColorStop(0,'#fdf6e3'); face.addColorStop(1,'#e8d5ab'); }
  ctx.fillStyle=face; ctx.fill();

  ctx.strokeStyle=o.hot?'#b9822c':'#c2a778'; ctx.lineWidth=2; ctx.stroke();

  ctx.beginPath();
  ctx.roundRect(-size/2+4,-size/2+4,size-8,size*0.34,r*0.7);
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fill();

  ctx.fillStyle=o.hot?'#5a3208':'#4a3316';
  ctx.font='800 '+Math.round(size*0.58)+'px Georgia, "Segoe UI", serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(ch.toUpperCase(),0,size*0.04);
  ctx.restore();
}

function drawWordCard(t){
  const e = current();
  const cx=W/2, cy=486;
  ctx.save();

  const word=String(e.word||'');
  const size=Math.min(64, Math.max(30, Math.floor((W-200)/Math.max(1,word.length))));

  /* label above the word */
  ctx.textAlign='center';
  ctx.font='700 12px Segoe UI';
  ctx.fillStyle= e.isVocab? '#ffd166':'rgba(255,232,190,0.75)';
  ctx.fillText((e.isVocab?'VOCABULARY · ':'')+e.rule.name.toUpperCase(), cx, cy-46);

  /* the word itself, plain and large */
  const glow = listening? 0.5+Math.sin(t*7)*0.5 : 0;
  ctx.save();
  ctx.font='800 '+size+'px Georgia, "Segoe UI", serif';
  ctx.textBaseline='middle';
  ctx.shadowColor='rgba(255,209,102,'+(0.35+glow*0.5)+')';
  ctx.shadowBlur=18+glow*22;
  ctx.fillStyle= listening? '#fff3d0' : '#fdf6e3';
  ctx.fillText(word, cx, cy-4);
  ctx.restore();

  /* pronunciation line, straight under the word */
  const ipa = e.ipa;   /* the respelling has its own line below */
  if(ipa){
    ctx.font='600 20px "Segoe UI", sans-serif';
    ctx.fillStyle='#ffd166';
    ctx.fillText(ipa, cx, cy+size*0.62+8);
  }

  /* respelling or tip, below the tiles */
  const belowY=cy+size*0.62+34;
  if(e.isVocab && e.meaning){
    ctx.font='italic 500 14px Georgia, serif'; ctx.fillStyle='rgba(255,236,200,0.86)';
    const mm = e.meaning.length>72 ? e.meaning.slice(0,70)+'…' : e.meaning;
    ctx.fillText(mm, cx, belowY);
    if(e.respell){
      ctx.font='700 14px Segoe UI'; ctx.fillStyle='#ffd166';
      ctx.fillText('say it like:  '+e.respell, cx, belowY+20);
    }
  }else if(e.respell){
    ctx.font='700 16px Segoe UI'; ctx.fillStyle='#ffd166';
    ctx.fillText('say it like:  '+e.respell, cx, belowY);
  }else{
    ctx.font='500 13px Segoe UI'; ctx.fillStyle='rgba(255,232,190,0.66)';
    const tip = e.rule.tip.length>80 ? e.rule.tip.slice(0,78)+'…' : e.rule.tip;
    ctx.fillText(tip, cx, belowY);
  }

  /* attempt dots */
  const ax=cx+Math.min(300, size*word.length*0.34)+34;
  for(let i=0;i<MAX_ATTEMPTS;i++){
    ctx.beginPath(); ctx.arc(ax, cy-size*0.4+i*13, 4, 0, Math.PI*2);
    ctx.fillStyle = i<state.attempt ? '#e05a4a' : 'rgba(255,232,190,0.3)';
    ctx.fill();
  }

  /* progress pips along the bottom */
  const n=state.entries.length, pw=Math.min(9,n);
  for(let i=0;i<pw;i++){
    const px=cx-(pw-1)*7+i*14;
    ctx.beginPath(); ctx.arc(px, cy+size*0.62+58, 3.4, 0, Math.PI*2);
    ctx.fillStyle = i<state.idx ? '#8ac48a' : i===state.idx ? '#ffd166' : 'rgba(255,232,190,0.26)';
    ctx.fill();
  }
  ctx.restore();
}

function drawHUD(){
  hpBar(56,44,250,20, state.heroShown/state.heroMax, ['#8ffcd0','#3fae7f'],
        'SENTENCE SEEKER  '+Math.max(0,Math.round(state.heroHP)));
  hpBar(W-306,44,250,20, state.bossShown/state.bossMax, ['#ffb35d','#ff5d73'],
        state.boss.name.toUpperCase()+'  '+Math.max(0,Math.round(state.bossHP)));
  ctx.textAlign='center'; ctx.font='700 13px Segoe UI'; ctx.fillStyle='#ffd166';
  ctx.fillText('SCORE '+state.score, W/2, 52);
  if(state.combo>1){
    ctx.font='700 15px Segoe UI'; ctx.fillStyle='#ffd166';
    ctx.fillText('COMBO x'+state.combo, W/2, 72);
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function update(){
  if(travel>0) travel = Math.max(0, travel - 0.016);
  if(deathT>0) deathT = Math.max(0, deathT - 0.022);
  if(marchT>0) marchT = Math.max(0, marchT - 0.014);
  if(arriveT>0) arriveT = Math.max(0, arriveT - 0.03);

  heroAnim.bob+=0.05; bossAnim.bob+=0.045;
  heroAnim.hit*=0.86; bossAnim.hit*=0.86;
  heroAnim.cast*=0.88; bossAnim.lunge*=0.88;
  if(bossAnim.dead>0 && bossAnim.dead<1) bossAnim.dead=Math.min(1,bossAnim.dead+0.02);
  shake*=0.86;
  state.heroShown += (state.heroHP-state.heroShown)*0.12;
  state.bossShown += (state.bossHP-state.bossShown)*0.12;

  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t+=0.065; p.spin+=0.3;
    if(p.t>=1){ p.onArrive(); projectiles.splice(i,1); }
    else{
      const arc=Math.sin(p.t*Math.PI)*-70;
      p.x=p.fx+(p.tx-p.fx)*p.t; p.y=p.fy+(p.ty-p.fy)*p.t+arc;
      if(Math.random()<0.7) particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*0.7,
        vy:(Math.random()-0.5)*0.7,life:16,max:16,color:p.color,r:1.4+Math.random()*1.6});
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i]; q.x+=q.vx; q.y+=q.vy; q.vy+=0.08; q.life--;
    if(q.life<=0) particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const u=popups[i]; u.y-=0.75; u.life--;
    if(u.life<=0) popups.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=(r.max-r.r)*0.16; r.life--;
    if(r.life<=0) rings.splice(i,1);
  }
}

function render(){
  const t=performance.now()*0.001;
  ctx.save();
  ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.clearRect(-30,-30,W+60,H+60);
  ctx.save();
  ctx.translate(camX(),0);
  drawBackground(t);
  drawHero(t);
  drawBoss(t);
  ctx.restore();   // the camera moves the world, not the interface
  drawHUD();

  for(const r of rings){
    ctx.globalAlpha=Math.max(0,r.life/26)*0.7;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=r.color; ctx.lineWidth=3; ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const p of projectiles){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin);
    ctx.shadowColor=p.color; ctx.shadowBlur=22;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2;
      ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);
      ctx.lineTo(Math.cos(a+Math.PI/4)*4.5,Math.sin(a+Math.PI/4)*4.5); }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore();
  }
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,Math.PI*2);
    ctx.fillStyle=q.color; ctx.fill(); ctx.globalAlpha=1;
  }
  for(const u of popups){
    const k=u.life/u.max;
    ctx.globalAlpha=Math.max(0,k);
    ctx.font='700 '+(u.size*(1+(1-k)*0.25))+'px Segoe UI'; ctx.textAlign='center';
    ctx.fillStyle=u.color;
    ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=6;
    ctx.fillText(u.text,u.x,u.y); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  if(state.entries.length) drawWordCard(t);
  vignette();
  ctx.restore();
}

function loop(){ update(); render(); requestAnimationFrame(loop); }

/* ============================================================
   BOOT — a shared link starts the round immediately
   ============================================================ */
(function boot(){
  const shared = decodeRound(location.hash);
  if(shared){
    document.getElementById('wordsInput').value = shared.words.join(', ');
    document.getElementById('vocabInput').value =
      shared.vocab.map(v=>v.meaning? v.word+' = '+v.meaning : v.word).join('\n');
    buildRound(shared.words, shared.vocab);
    showScreen('screenBattle');
    if(MONITOR){
      /* a mirror must never ask the trainer's browser for a microphone */
      setStatus('Waiting for your trainee to start…');
    }else{
      warmUpMic();
      setStatus('Your trainer picked these — tap the mic and say the first one');
    }
  }else{
    buildRound(['water','better','little'], []);   // harmless default so canvas has state
    state.running=false;
  }
  loop();
})();
</script>

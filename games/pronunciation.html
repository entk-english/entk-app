<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Seeker — American Pronunciation Battle</title>
<style>
  :root{
    --bg1:#150c30; --bg2:#080418;
    --panel:rgba(40,24,74,0.72); --panel-border:rgba(124,92,200,0.45);
    --accent:#7cf5c4; --accent2:#ffd166; --danger:#ff5d73; --gold:#ffc94d;
    --text:#f3eeff; --muted:#a996d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg2);
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  body::before{content:'';position:fixed;inset:0;z-index:-2;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,#2a1a5c,transparent 70%),
               radial-gradient(ellipse 60% 50% at 80% 100%,#1d2a5e,transparent 70%),
               linear-gradient(180deg,#150c30,#080418);}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:20px;overflow-y:auto;}
  .screen.active{display:flex;}

  /* ---------- SETUP ---------- */
  #setupCard{width:min(680px,94vw);background:var(--panel);border:1px solid var(--panel-border);
    border-radius:20px;padding:28px 30px;backdrop-filter:blur(14px);
    box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);}
  .brand{text-align:center;margin-bottom:22px;}
  .brand h1{margin:0;font-size:30px;letter-spacing:-0.5px;
    background:linear-gradient(120deg,#fff,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{margin:6px 0 0;color:var(--muted);font-size:13px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  textarea,input[type=text]{width:100%;background:rgba(10,4,26,0.7);
    border:1px solid var(--panel-border);color:var(--text);border-radius:10px;
    padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s;}
  textarea:focus,input:focus{border-color:var(--accent);}
  textarea{min-height:92px;resize:vertical;line-height:1.5;}
  .btn{background:linear-gradient(180deg,#8ffcd0,#3fae7f);border:none;color:#06251a;
    font-weight:700;font-size:15px;padding:13px 28px;border-radius:11px;cursor:pointer;
    box-shadow:0 4px 0 #2b8a64;transition:transform .06s,box-shadow .06s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b8a64;}
  .btn.ghost{background:rgba(255,255,255,0.07);color:var(--text);
    border:1px solid var(--panel-border);box-shadow:none;}
  .btn.ghost:active{transform:translateY(2px);}
  .btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a520);color:#3a2600;box-shadow:0 4px 0 #a87610;}
  .btnRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  .chip{background:rgba(124,245,196,0.12);border:1px solid rgba(124,245,196,0.35);
    color:var(--accent);font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;}
  .chip:hover{background:rgba(124,245,196,0.22);}
  #shareBox{margin-top:14px;padding:13px 15px;background:rgba(255,201,77,0.08);
    border:1px solid rgba(255,201,77,0.35);border-radius:11px;display:none;}
  #shareBox.show{display:block;}
  #shareBox .lbl{font-size:11px;color:var(--gold);text-transform:uppercase;
    letter-spacing:1px;font-weight:700;margin-bottom:7px;}
  #shareUrl{width:100%;font-size:11px;background:rgba(0,0,0,0.35);color:var(--muted);
    border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:8px 10px;
    font-family:ui-monospace,monospace;}

  /* ---------- BATTLE ---------- */
  #battleWrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  canvas{border-radius:18px;display:block;max-width:96vw;max-height:64vh;
    box-shadow:0 24px 70px rgba(0,0,0,0.65), 0 0 0 1px rgba(124,92,200,0.4);}
  #controls{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;}
  #micBtn{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;font-size:34px;
    background:radial-gradient(circle at 35% 28%,#9dffd9,#33a578);color:#052a1c;
    box-shadow:0 7px 0 #237a56, 0 0 30px rgba(124,245,196,0.35);
    transition:transform .07s,box-shadow .07s;}
  #micBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #237a56;}
  #micBtn:disabled{opacity:0.35;cursor:not-allowed;}
  #micBtn.retry{background:radial-gradient(circle at 35% 28%,#ffdf9d,#e0a520);
    box-shadow:0 7px 0 #a87610, 0 0 26px rgba(255,201,77,0.45);}
  #micBtn.listening{background:radial-gradient(circle at 35% 28%,#ffc2ca,#e8455e);
    box-shadow:0 7px 0 #a32d40;animation:pulseMic 1.15s infinite;}
  @keyframes pulseMic{
    0%{box-shadow:0 7px 0 #a32d40, 0 0 0 0 rgba(255,93,115,0.55);}
    70%{box-shadow:0 7px 0 #a32d40, 0 0 0 26px rgba(255,93,115,0);}
    100%{box-shadow:0 7px 0 #a32d40, 0 0 0 0 rgba(255,93,115,0);}
  }
  .sideBtns{display:flex;flex-direction:column;gap:7px;}
  .miniBtn{background:rgba(255,255,255,0.08);border:1px solid var(--panel-border);
    color:var(--text);font-size:12px;padding:8px 15px;border-radius:9px;cursor:pointer;
    white-space:nowrap;transition:background .15s;}
  .miniBtn:hover{background:rgba(255,255,255,0.16);}
  .miniBtn:disabled{opacity:0.35;cursor:not-allowed;}
  #micHelp{text-align:center;font-size:12px;color:var(--muted);margin-top:7px;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  #micHelp label{display:flex;gap:5px;align-items:center;cursor:pointer;}
  #micHelp #micHint{opacity:.6;}
  #statusLine{text-align:center;font-size:14px;color:var(--muted);min-height:20px;
    max-width:640px;line-height:1.4;}
  #statusLine b{color:var(--accent2);}

  /* ---------- RESULTS ---------- */
  #resultsCard{width:min(620px,94vw);background:var(--panel);border:1px solid var(--panel-border);
    border-radius:20px;padding:28px 30px;backdrop-filter:blur(14px);max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  #resultsCard h2{margin:0 0 4px;font-size:26px;text-align:center;}
  #resultsSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;}
  .wordRow{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
    background:rgba(255,255,255,0.04);margin-bottom:8px;}
  .wordRow .w{font-weight:700;font-size:16px;min-width:96px;}
  .wordRow .stars{font-size:15px;letter-spacing:1px;min-width:52px;}
  .wordRow .tip{font-size:11.5px;color:var(--muted);flex:1;line-height:1.35;}
  .wordRow .pct{font-size:13px;font-weight:700;min-width:44px;text-align:right;}
</style>
</head>
<body>

<!-- ============ SETUP SCREEN ============ -->
<div class="screen active" id="screenSetup">
  <div id="setupCard">
    <div class="brand">
      <h1>Sentence Seeker</h1>
      <p>American Pronunciation Battle — defeat the boss by saying it right</p>
    </div>
    <div class="field">
      <label for="wordsInput">Words the trainee got wrong</label>
      <textarea id="wordsInput" placeholder="water, better, little, city&#10;(commas or one per line)"></textarea>

    </div>
    <div class="field">
      <label for="vocabInput">Session vocabulary <span style="text-transform:none;letter-spacing:0">(optional — one per line, <b>word = meaning</b>)</span></label>

          Works once this file is hosted online (GitHub Pages, Netlify, your academy site).
        </span>
      </div>
    </div>
  </div>
</div>

<!-- ============ BATTLE SCREEN ============ -->
<div class="screen" id="screenBattle">
  <div id="battleWrap">
    <canvas id="game" width="960" height="600"></canvas>
    <div id="controls">
      <div class="sideBtns">
        <button class="miniBtn" id="listenBtn">🔊 Hear it</button>
        <button class="miniBtn" id="slowBtn">🐢 Slowly</button>
      </div>

      </div>

</div>

<!-- ============ RESULTS SCREEN ============ -->
<div class="screen" id="screenResults">
  <div id="resultsCard">
    <h2 id="resultsTitle">Victory!</h2>

      <button class="btn gold" id="againBtn">↻ Practice weak words</button>
      <button class="btn ghost" id="newRoundBtn">＋ New round</button>
    </div>
  </div>
</div>

<script>
"use strict";
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y); this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]); this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h); this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]); this.quadraticCurveTo(x,y,x+r[0],y);
    return this;
  };
}

/* ============================================================
   AMERICAN PRONUNCIATION RULE ENGINE
   Each word the trainer types is auto-analyzed and tagged with
   the American-accent rule it exercises, plus a coaching tip and
   a plain-English respelling the trainee can actually read.
   ============================================================ */
// words ending in "s" that are NOT plurals/3rd-person verbs — they must not
// be graded as an "-S ending" drill
// the T here keeps its full sound because the NEXT syllable is stressed
const NO_FLAP = new Set(['attack','attempt','attend','attach','attain','attract','attire',
  'hotel','until','untie','return','retire','retain','retreat','detail','detain','detect',
  'guitar','eternal','italian','potential','material','maintain','obtain','contain','pretend',
  'protect','protest','routine','fatigue','boutique','utensil','utility','atomic','italic']);

const NON_PLURAL_S = new Set(['this','his','is','was','has','yes','us','thus','plus','gas',
  'bus','less','miss','class','glass','press','cross','always','perhaps','across','unless',
  'business','illness','address','famous','nervous','serious','various','curious','bonus']);

const RULES = [
  {
    id:'edEnding', name:'-ED ending',
    test:w=>/ed$/.test(w)&&w.length>3,
    tip:'After t/d say "id". After voiceless sounds (k,p,s,f,ch,sh) say "t". Otherwise say "d". Never "e-d".',
    respell:w=>{
      const s=w.slice(0,-2);
      if(/[td]$/.test(s)) return s+'-id';
      if(/(k|p|s|f|x|ch|sh)$/.test(s)) return s+'t';
      return s+'d';
    }
  },
  {
    id:'sEnding', name:'-S ending',
    test:w=>/s$/.test(w)&&w.length>3&&!/ss$/.test(w)&&!NON_PLURAL_S.has(w),
    tip:'After s/z/sh/ch/x say "iz". After voiceless sounds say "s". Otherwise it\'s a buzzing "z".',
    respell:w=>{
      // "boxes"/"washes" take a full -iz syllable; strip the whole "es"
      if(/([sxz]|sh|ch|ge)es$/.test(w)) return w.slice(0,-2)+'-iz';
      const s=w.slice(0,-1);
      if(/(k|p|t|f|th)$/.test(s)) return s+'s';
      return s+'z';
    }
  },
  {
    id:'flapT', name:'Flap T',
    // T becomes a quick tap between vowels, after R, or before a syllabic L —
    // but NOT word-initially, not in "-tion/-tial", and not when the syllable
    // after the T carries the stress (attack, hotel, return…)
    test:w=>!/^t/.test(w) && !/ti(on|al|ous|an|ent)/.test(w) && !NO_FLAP.has(w) &&
            ( /[aeiouy][r]?(tt|t)[aeiouy]/.test(w) || /(tt|t)le$/.test(w) ),
    tip:'Between vowels, American T sounds like a quick D. Tap the tongue — don\'t punch the T.',
    respell:w=>{
      if(/(tt|t)le$/.test(w)) return w.replace(/(tt|t)le$/,'dle');
      // flap the LAST eligible T — in "potato" it's the second one that taps
      let out=w, last=-1, re=/([aeiouy][r]?)(tt|t)(?=[aeiouy])/g, m;
      while((m=re.exec(w))!==null){ last=m.index; re.lastIndex=m.index+1; }
      if(last>=0){
        const mm=/([aeiouy][r]?)(tt|t)/.exec(w.slice(last));
        if(mm) out = w.slice(0,last)+mm[1]+'d'+w.slice(last+mm[0].length);
      }
      return out;
    }
  },
  {
    id:'th', name:'TH sound',
    test:w=>/th/.test(w),
    tip:'Tongue tip lightly between the teeth. Not "d", not "z", not "s".',
    respell:null
  },
  {
    id:'ing', name:'-ING ending',
    test:w=>/ing$/.test(w),
    tip:'End in the back of the nose: "-ing", not "-een" and not "-in\'".',
    respell:null
  },
  {
    id:'rColored', name:'R-colored vowel',
    test:w=>/(er|ir|ur|or|ar|ear|our)/.test(w),
    tip:'Curl the tongue back and hold the R. American R is strong — never drop it.',
    respell:null
  },
  {
    id:'darkL', name:'Dark L',
    test:w=>/l$/.test(w)||/le$/.test(w)||/l[bcdfgkmnpstvz]/.test(w),
    tip:'Back of the tongue lifts — a heavy, hollow L. Sounds almost like "oh" before the L.',
    respell:null
  },
  {
    id:'silent', name:'Silent letter',
    test:w=>/^(kn|wr|gn|ps)/.test(w)||/mb$/.test(w)||/(gh|lk|st[ae]n)/.test(w),
    tip:'Some letters here are silent — say only the sounds, not the spelling.',
    respell:null
  },
  {
    id:'schwa', name:'Schwa reduction',
    test:w=>w.length>=7,
    tip:'Stress ONE syllable hard; squeeze the rest into a lazy "uh". English is not evenly timed.',
    respell:null
  }
];
const DEFAULT_RULE = {
  id:'clear', name:'Clear articulation',
  tip:'Say it fully and confidently — open the mouth and finish the final sound.',
  respell:null
};

function analyzeWord(raw){
  const word = String(raw).trim();
  const w = word.toLowerCase();
  for(const r of RULES){
    try{ if(r.test(w)) return { word, rule:r, respell: r.respell? r.respell(w): null }; }
    catch(e){ /* a bad regex must never break round creation */ }
  }
  return { word, rule:DEFAULT_RULE, respell:null };
}

/* ============================================================
   BOSS ROSTER (from the character sheet)
   ============================================================ */
const BOSSES = [
  { name:'Word Wizard',       type:'wraith',  hue:265, hp:100 },
  { name:'Tense Troll',       type:'troll',   hue:100, hp:115 },
  { name:'Subject Specter',   type:'ghost',   hue:195, hp:105 },
  { name:'Ending Eater',      type:'slime',   hue:95,  hp:120 },
  { name:'Connector Count',   type:'vampire', hue:345, hp:125 },
  { name:'Pronoun Patrol',    type:'robot',   hue:205, hp:120 },
  { name:'Punctuation Beast', type:'dragon',  hue:15,  hp:140 },
  { name:'Adjective Witch',   type:'witch',   hue:280, hp:130 },
  { name:'Overlord',          type:'knight',  hue:220, hp:145 },
  { name:'Infinitive Mimic',  type:'book',    hue:35,  hp:135 }
];

const PRESETS = [
  { label:'Flap T', words:'water, better, little, city, party' },
  { label:'TH', words:'think, this, three, mother, birthday' },
  { label:'-ED', words:'walked, played, wanted, jumped, needed' },
  { label:'-S', words:'cats, dogs, boxes, washes, watches' },
  { label:'R sound', words:'world, first, girl, work, water' },
  { label:'Dark L', words:'milk, feel, cold, people, table' }
];

/* ============================================================
   ACCENT DIAGNOSIS
   When the recognizer hears a DIFFERENT real word, that mishearing
   is itself evidence of which American sound went wrong. Mapping the
   common substitutions lets us name the exact error instead of just
   saying "wrong".
   ============================================================ */
const SUBSTITUTIONS = [
  { from:/^(s|f)(ink|ought|ree|understand)/, when:/^th/,
    say:'You replaced TH with S/F. Tongue tip between the teeth, blow air.' },
  { from:/^(d|z)/, when:/^th/,
    say:'You replaced TH with D/Z. Touch the tongue tip to the teeth, let it buzz.' },
  { from:/^t/,   when:/^th/,   say:'You said a hard T instead of TH. Tongue must touch the teeth.' },
  { from:/^w/,   when:/^v/,    say:'V, not W. Top teeth on the bottom lip.' },
  { from:/^v/,   when:/^w/,    say:'W, not V. Round the lips, no teeth.' },
  { from:/^l/,   when:/^r/,    say:'R, not L. Curl the tongue back, do not touch the roof.' },
  { from:/^r/,   when:/^l/,    say:'L, not R. Tongue tip up on the ridge behind the teeth.' },
  { from:/^b/,   when:/^p/,    say:'P is voiceless — add a puff of air, no voice.' },
  { from:/^p/,   when:/^b/,    say:'B is voiced — hum through it.' },
  { from:/^sh/,  when:/^ch/,   say:'CH starts with a T-burst: t+sh, not a plain sh.' },
  { from:/^ch/,  when:/^sh/,   say:'SH is smooth — no T at the front.' },
  { from:/^(ship|shit|sit|bit|bid|lift)$/, when:/^(sheep|seat|beat|bead|leaf)$/,
    say:'Vowel too short. Long EE — stretch it.' },
  { from:/^(sheep|seat|beat)$/, when:/^(ship|sit|bit)$/,
    say:'Vowel too long. Short I — relax and clip it.' }
];

// heard vs target both normalised, lowercase
function diagnose(target, heard){
  if(!heard) return null;
  const t=target.toLowerCase(), h=heard.toLowerCase().trim().split(/\s+/)[0]||'';
  if(!h || h===t) return null;
  for(const s of SUBSTITUTIONS){
    if(s.when.test(t) && s.from.test(h)) return s.say;
  }
  // dropped ending is the other very common American-accent failure
  if(t.length-h.length>=1 && t.startsWith(h)){
    const tail=t.slice(h.length);
    if(/^(ed|d|t)$/.test(tail)) return 'You dropped the -ED ending. It must be heard.';
    if(/^(s|es|z)$/.test(tail)) return 'You dropped the final S. It must be heard.';
    return 'You cut the end of the word off. Finish the final sound.';
  }
  return null;
}

/* ============================================================
   STATE
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const MAX_ATTEMPTS = 3;   // trainee gets retries; best score counts

const state = {
  entries: [],        // {word, rule, respell, meaning, isVocab}
  idx: 0,
  attempt: 0,         // attempts used on the current word
  bestPct: 0,         // best score so far on the current word
  lastHeard: '',
  boss: BOSSES[0],
  bossIdx: 0,
  heroHP: 100, heroMax: 100, heroShown: 100,
  bossHP: 100, bossMax: 100, bossShown: 100,
  combo: 0, bestCombo: 0, score: 0,
  results: [],        // {word, pct, stars, rule}
  busy: false, running: false
};

function heroPos(){ return {x:190,y:352}; }
function bossPos(){ return {x:745,y:312}; }

let projectiles=[], particles=[], popups=[], rings=[];
let heroAnim={bob:0,hit:0,cast:0}, bossAnim={bob:0,hit:0,lunge:0,dead:0};
let shake=0;

/* ============================================================
   AUDIO — tiny synth so hits/wins have feel without asset files
   ============================================================ */
let actx=null;
function sfx(type){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    if(type==='hit'){ o.type='triangle'; o.frequency.setValueAtTime(680,t);
      o.frequency.exponentialRampToValueAtTime(180,t+0.18); g.gain.setValueAtTime(0.18,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.start(t); o.stop(t+0.21); }
    else if(type==='miss'){ o.type='sawtooth'; o.frequency.setValueAtTime(200,t);
      o.frequency.exponentialRampToValueAtTime(70,t+0.25); g.gain.setValueAtTime(0.14,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t); o.stop(t+0.29); }
    else if(type==='win'){ [523,659,784,1047].forEach((f,i)=>{
        const oo=actx.createOscillator(), gg=actx.createGain();
        oo.connect(gg); gg.connect(actx.destination); oo.type='triangle';
        oo.frequency.setValueAtTime(f,t+i*0.1); gg.gain.setValueAtTime(0.14,t+i*0.1);
        gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.28);
        oo.start(t+i*0.1); oo.stop(t+i*0.1+0.3); }); }
  }catch(e){}
}

/* ============================================================
   ROUND SETUP + SHARE LINKS
   ============================================================ */
// words = plain drill words; vocab = [{word, meaning}] shown with its meaning
function buildRound(words, vocab){
  const drill = (words||[]).map(w=>analyzeWord(w));
  const vlist = (vocab||[]).map(v=>{
    const e = analyzeWord(v.word);
    e.meaning = v.meaning || '';
    e.isVocab = true;
    return e;
  });
  state.entries = drill.concat(vlist);
  state.idx = 0;
  state.attempt = 0; state.bestPct = 0; state.lastHeard='';
  state.boss = BOSSES[state.bossIdx % BOSSES.length];
  state.heroHP = state.heroMax = 100; state.heroShown = 100;
  state.bossHP = state.bossMax = state.boss.hp; state.bossShown = state.boss.hp;
  state.combo = 0; state.bestCombo = 0; state.score = 0;
  state.results = [];
  state.busy = false; state.running = true;
  projectiles=[]; particles=[]; popups=[]; rings=[];
  bossAnim.dead = 0;
  lastBlob = null;
  const pb=document.getElementById('playbackBtn'); if(pb) pb.disabled = true;
}

function parseWords(raw){
  return String(raw).split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean).slice(0,20);
}

// "word = meaning" per line; a bare word is allowed (no meaning)
function parseVocab(raw){
  return String(raw).split(/\n+/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const m = /^(.+?)\s*[=:–-]\s*(.+)$/.exec(line);
    return m ? { word:m[1].trim(), meaning:m[2].trim() } : { word:line, meaning:'' };
  }).filter(v=>v.word).slice(0,20);
}

function encodeRound(words, vocab){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify({w:words, v:vocab||[]})))); }
  catch(e){ return ''; }
}
function decodeRound(hash){
  try{
    const m = /[#&]r=([^&]+)/.exec(hash);
    if(!m) return null;
    // the payload may arrive percent-encoded when the host app builds the link
    const raw = /%[0-9a-fA-F]{2}/.test(m[1]) ? decodeURIComponent(m[1]) : m[1];
    const obj = JSON.parse(decodeURIComponent(escape(atob(raw))));
    const w = Array.isArray(obj.w) ? obj.w : [];
    const v = Array.isArray(obj.v) ? obj.v : [];
    return (w.length||v.length) ? {words:w, vocab:v} : null;
  }catch(e){ return null; }
}

  document.getElementById(id).classList.add('active');

function setStatus(html){ document.getElementById('statusLine').innerHTML = html; }

/* ============================================================
   SPEECH — recognition scoring, reference TTS, self playback
   ============================================================ */
const micBtn = document.getElementById('micBtn');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition=null, listening=false, gotResult=false;
let mediaRecorder=null, chunks=[], lastBlob=null, micStream=null;

if(SR){
  recognition = new SR();
  recognition.lang='en-US';
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=5;   // more alternatives => better scoring signal

  recognition.onresult = e=>{
    gotResult = true;
    const alts=[];
    for(let i=0;i<e.results[0].length;i++){
      alts.push({ text:e.results[0][i].transcript, conf:e.results[0][i].confidence||0 });
    }
    scoreAttempt(alts);
  };
  recognition.onerror = e=>{
    stopListening();
    if(e.error==='not-allowed') setStatus('🎤 Microphone blocked — allow mic access in the browser, then try again.');
    else if(e.error==='no-speech') setStatus('I didn\'t hear anything — tap the mic and speak clearly.');
    else setStatus('Mic error ('+e.error+') — tap the mic to retry.');
  };
  recognition.onend = ()=>{
    stopListening();
    if(gotResult){ emptyRuns = 0; return; }
    emptyRuns++;
    /* Twice in a row with nothing at all, on the online recognizer,
       is the network symptom rather than a quiet trainee. */
    if(emptyRuns >= 2 && speechMode === 'cloud'){
      const offer = document.getElementById('localBtn');
      setStatus(offer && offer.style.display !== 'none'
        ? 'Nothing is coming back from the recogniser — tap <b>Use offline speech</b> below.'
        : 'The recogniser is returning nothing. This is usually the browser, not you — '+
          'try opening this page in <b>Microsoft Edge</b>.');
    }else{
      setStatus('Didn\'t catch that — tap the mic and try again.');
    }
  };
}else{
  micBtn.disabled = true;
}

let recordPlayback = true;
(function wireRecToggle(){
  const box = document.getElementById('recToggle');
  if(!box) return;
  box.onchange = ()=>{
    recordPlayback = box.checked;
    if(!recordPlayback){
      releaseMic();
      const pb=document.getElementById('playbackBtn'); if(pb) pb.disabled = true;
    }
  };
})();

function stopListening(){
  listening=false;
  micBtn.classList.remove('listening');
  if(mediaRecorder && mediaRecorder.state==='recording'){ try{ mediaRecorder.stop(); }catch(e){} }
  else releaseMic();
}

// Ask for the mic once when the battle opens, not on the first attempt —
// otherwise the permission prompt eats the trainee's first spoken word.
// The stream is released straight away: the point is to bank the permission,
// and an open capture sitting idle competes with the recognizer for the
// device on Windows, which shows up as "I spoke and nothing happened".
async function warmUpMic(){
  try{
    if(navigator.mediaDevices){
      const s = await navigator.mediaDevices.getUserMedia({audio:true});
      releaseMic(s);
    }
  }catch(e){
    setStatus('🎤 Microphone blocked. Click the padlock in the address bar, allow the microphone, then reload.');
  }
  setupLocalSpeech();
}

function releaseMic(s){
  const target = s || micStream;
  if(target){ try{ target.getTracks().forEach(t=>t.stop()); }catch(e){} }
  if(!s) micStream = null;
}

/* ------------------------------------------------------------
   OFFLINE SPEECH
   By default Chrome streams the audio to Google and waits for the
   text to come back. On a connection that cannot reach it, that
   round trip simply never completes: recognition starts, hangs,
   and ends with no result and no error. Chrome can also run the
   recognizer on the machine itself, which removes the network from
   the picture entirely — preferred here whenever it is available.
   ------------------------------------------------------------ */
let speechMode = 'cloud';
let emptyRuns = 0;

function setSpeechLabel(text, good){
  const el = document.getElementById('speechMode');
  if(!el) return;
  el.textContent = text;
  el.style.color = good ? 'var(--accent)' : 'var(--muted)';
}

/* Never let a capability probe hold the game up: if it has not
   answered in a few seconds, carry on with the online recognizer. */
function withTimeout(promise, ms, fallback){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(()=>resolve(fallback), ms))
  ]);
}

/* Deliberately never probed automatically. Chrome's on-device
   availability check can block the renderer while it answers, and a
   game that freezes at the start of a round is worse than one that
   needs a working connection. So the trainer asks for it, once, and
   only then does anything run. */
function setupLocalSpeech(){
  const b = document.getElementById('localBtn');
  if(!recognition || !SR || typeof SR.available !== 'function'){
    setSpeechLabel('online speech', false);
    if(b) b.style.display = 'none';
    return;
  }
  setSpeechLabel('online speech', false);
  if(b) b.style.display = '';
}

(function wireLocalBtn(){
  const b = document.getElementById('localBtn');
  if(!b) return;
  b.onclick = async ()=>{
    b.disabled = true; b.textContent = 'Checking…';
    setStatus('Setting up offline speech — this can take a moment the first time.');
    try{
      let state = await withTimeout(
        SR.available({ langs:['en-US'], processLocally:true }), 8000, 'timeout');

      if(state === 'downloadable' || state === 'downloading'){
        b.textContent = 'Downloading…';
        const ok = await withTimeout(
          SR.install({ langs:['en-US'], processLocally:true }), 120000, false);
        state = ok ? 'available' : 'unavailable';
      }

      if(state === 'available'){
        recognition.processLocally = true;
        speechMode = 'on-device';
        setSpeechLabel('offline speech ✓', true);
        b.style.display = 'none';
        setStatus('Offline speech ready — tap the mic and say <b>'+current().word+'</b>.');
        return;
      }

      b.disabled = false; b.textContent = '⬇ Use offline speech';
      setStatus(state === 'timeout'
        ? 'Offline speech did not answer in time. Staying on the online recogniser.'
        : 'Offline speech is not available for English on this machine.');
    }catch(e){
      b.disabled = false; b.textContent = '⬇ Use offline speech';
      setStatus('Could not switch to offline speech — '+e.message);
    }
  };
})();

micBtn.onclick = async ()=>{
  if(!recognition || listening || state.busy || !state.running) return;
  listening=true; gotResult=false;
  micBtn.classList.add('listening');
  setStatus('Listening… say <b>'+current().word+'</b>');
  // Capture audio in parallel so the trainee can hear themselves back.
  // Optional on purpose: on some machines a second capture running
  // alongside the recognizer is exactly what stops speech being heard,
  // so this can be switched off without losing the scoring.
  if(recordPlayback){
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[]; mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = ev=>{ if(ev.data.size) chunks.push(ev.data); };
      mediaRecorder.onstop = ()=>{
        if(chunks.length){ lastBlob = new Blob(chunks,{type:chunks[0].type||'audio/webm'});
          document.getElementById('playbackBtn').disabled=false; }
        releaseMic();   // never leave the device held open between attempts
      };
      mediaRecorder.start();
    }catch(e){ /* recording is a bonus; scoring still works without it */ }
  }
  try{ recognition.start(); }catch(e){ stopListening(); }
};

function current(){ return state.entries[state.idx] || {word:'',rule:DEFAULT_RULE}; }

function norm(s){ return String(s).toLowerCase().replace(/[^a-z]/g,''); }

/* Turn the recognizer's alternatives into a 0-100 pronunciation score.
   Exact top match with high confidence scores best; finding the word only
   in lower-ranked alternatives means it was said unclearly. */
function scoreAttempt(alts){
  const target = norm(current().word);
  let pct = 0, heard = alts[0] ? alts[0].text : '';
  for(let i=0;i<alts.length;i++){
    const words = norm(alts[i].text);
    const exact = words===target;
    const contains = new RegExp('(^|[^a-z])'+target+'([^a-z]|$)').test(' '+alts[i].text.toLowerCase()+' ');
    if(exact||contains){
      const rankPenalty = i*13;                       // lower alternative = less clear
      const conf = alts[i].conf>0 ? alts[i].conf : 0.82;
      let s = (exact?100:92) * (0.55 + 0.45*conf) - rankPenalty;
      pct = Math.max(pct, Math.round(Math.max(0,Math.min(100,s))));
    }
  }
  if(pct===0){
    // nothing matched — grade partial credit on letter overlap so a near-miss
    // isn't treated the same as saying a completely different word
    const h = norm(heard);
    let same=0;
    for(let i=0;i<Math.min(h.length,target.length);i++) if(h[i]===target[i]) same++;
    pct = Math.round(Math.max(0, Math.min(44, (same/Math.max(1,target.length))*44)));
  }
  handleAttempt(pct, heard);
}

function starsFor(pct){ return pct>=88?3 : pct>=72?2 : pct>=52?1 : 0; }

/* A word is not scored on one shot. The trainee gets up to MAX_ATTEMPTS and
   the BEST score is what counts — the point is to reach a correct American
   pronunciation, not to punish the first try. Only a fully used-up set of
   attempts with no passing score lets the boss strike. */
function handleAttempt(pct, heard){
  const entry = current();
  state.attempt++;
  state.lastHeard = heard;
  if(pct > state.bestPct) state.bestPct = pct;

  const passed = starsFor(pct) > 0;
  const outOfTries = state.attempt >= MAX_ATTEMPTS;

  if(!passed && !outOfTries){
    // give a precise correction and let them go again — no damage yet
    const why = diagnose(entry.word, heard);
    const left = MAX_ATTEMPTS - state.attempt;
    setStatus('❌ '+pct+'% — heard "<b>'+(heard||'…')+'</b>". '+
              (why||entry.rule.tip)+' <b>'+left+' tr'+(left===1?'y':'ies')+' left.</b>');
    sfx('miss');
    micBtn.classList.add('retry');
    return;   // stay on the same word
  }
  micBtn.classList.remove('retry');
  applyResult(state.bestPct, heard, entry);
}

function applyResult(pct, heard, entry){
  entry = entry || current();
  const stars = starsFor(pct);
  const why = stars===0 ? diagnose(entry.word, heard) : null;
  state.results.push({ word:entry.word, pct, stars, rule:entry.rule,
                       isVocab:!!entry.isVocab, meaning:entry.meaning||'',
                       attempts:state.attempt, heard, why });
  state.busy = true;

  if(stars>0){
    state.combo++;
    state.bestCombo = Math.max(state.bestCombo, state.combo);
    state.score += pct + state.combo*5;
    const dmg = Math.round((stars===3?26:stars===2?18:11) + state.combo*1.5);
    heroAnim.cast = 1;
    setStatus(stars===3? '⭐⭐⭐ Perfect — '+pct+'%'
            : stars===2? '⭐⭐ Good — '+pct+'%. '+entry.rule.tip
            : '⭐ Close — '+pct+'%. '+entry.rule.tip);
    sfx('hit');
    setTimeout(()=>{
      projectiles.push(makeProj(heroPos(), bossPos(), '#7cf5c4', ()=>{
        state.bossHP = Math.max(0, state.bossHP-dmg);
        bossAnim.hit=1; shake=9;
        burst(bossPos().x,bossPos().y,'#7cf5c4',26);
        rings.push({x:bossPos().x,y:bossPos().y,r:10,max:80,life:26,color:'#7cf5c4'});
        popup(bossPos().x,bossPos().y-46,'-'+dmg,'#7cf5c4',22);
        if(state.combo>1) popup(bossPos().x,bossPos().y-70,'COMBO x'+state.combo,'#ffd166',17);
        advance();
      }));
    },170);
  }else{
    state.combo = 0;
    bossAnim.lunge = 1;
    setStatus('❌ '+pct+'% — heard "<b>'+ (heard||'…') +'</b>". '+(why||entry.rule.tip));
    sfx('miss');
    setTimeout(()=>{
      projectiles.push(makeProj(bossPos(), heroPos(), '#ff5d73', ()=>{
        state.heroHP = Math.max(0, state.heroHP-14);
        heroAnim.hit=1; shake=11;
        burst(heroPos().x,heroPos().y,'#ff5d73',24);
        popup(heroPos().x,heroPos().y-46,'-14','#ff5d73',20);
        advance();
      }));
    },170);
  }
}

function advance(){
  state.busy = false;
  if(state.bossHP<=0){ bossAnim.dead=1; state.running=false; sfx('win');
    setTimeout(()=>showResults(true), 900); return; }
  if(state.heroHP<=0){ state.running=false;
    setTimeout(()=>showResults(false), 700); return; }
  state.idx++;
  state.attempt = 0; state.bestPct = 0; state.lastHeard='';   // fresh tries on the next word
  micBtn.classList.remove('retry');
  if(state.idx >= state.entries.length){
    state.running=false;
    const won = state.bossHP < state.bossMax*0.5;
    if(won) sfx('win');
    setTimeout(()=>showResults(won), 700);
    return;
  }
  document.getElementById('playbackBtn').disabled = true;
  lastBlob = null;
}

/* reference pronunciation + self playback */
function speak(rate){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(current().word);
    u.lang='en-US'; u.rate=rate;
    const v = speechSynthesis.getVoices().find(v=>/en-US/i.test(v.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.getElementById('listenBtn').onclick = ()=>speak(0.95);
document.getElementById('slowBtn').onclick   = ()=>speak(0.55);
document.getElementById('playbackBtn').onclick = ()=>{
  if(!lastBlob) return;
  const a = new Audio(URL.createObjectURL(lastBlob));
  a.play().catch(()=>{});
};

/* ============================================================
   RESULTS
   ============================================================ */
function showResults(won){
  const list = document.getElementById('resultsList');
  const avg = state.results.length
    ? Math.round(state.results.reduce((s,r)=>s+r.pct,0)/state.results.length) : 0;
  document.getElementById('resultsTitle').textContent =
    won ? state.boss.name+' Defeated!' : 'Round Over';
  document.getElementById('resultsSub').innerHTML =
    'Average accuracy <b style="color:var(--accent)">'+avg+'%</b> · '+
    'Score '+state.score+' · Best combo x'+state.bestCombo;
  list.innerHTML = '';

  const rowFor = r=>{
    const col = r.pct>=88?'#7cf5c4' : r.pct>=72?'#ffd166' : r.pct>=52?'#ffa94d':'#ff5d73';
    const note = r.why ? r.why : (r.rule.name+' — '+r.rule.tip);
    const tries = r.attempts>1 ? ' <span style="opacity:.65">('+r.attempts+' tries)</span>' : '';
    const row=document.createElement('div'); row.className='wordRow';
    row.innerHTML =
      '<span class="w">'+r.word+'</span>'+
      '<span class="stars" style="color:'+col+'">'+'★'.repeat(r.stars)+'☆'.repeat(3-r.stars)+'</span>'+
      '<span class="tip">'+note+tries+
        (r.meaning?'<br><i style="opacity:.75">'+r.meaning+'</i>':'')+'</span>'+
      '<span class="pct" style="color:'+col+'">'+r.pct+'%</span>';
    return row;
  };
  const heading = txt=>{
    const h=document.createElement('div');
    h.style.cssText='font-size:11px;letter-spacing:1px;text-transform:uppercase;'+
      'color:var(--muted);font-weight:700;margin:14px 0 7px;';
    h.textContent=txt; return h;
  };

  const drill = state.results.filter(r=>!r.isVocab);
  const vocab = state.results.filter(r=>r.isVocab);

  if(drill.length){
    list.appendChild(heading('Pronunciation drill'));
    drill.forEach(r=>list.appendChild(rowFor(r)));
  }

  if(vocab.length){
    const mastered = vocab.filter(r=>r.stars>=2);
    list.appendChild(heading('Session vocabulary — '+mastered.length+' of '+vocab.length+' pronounced correctly'));
    vocab.forEach(r=>list.appendChild(rowFor(r)));

    const still = vocab.filter(r=>r.stars<2).map(r=>r.word);
    const box=document.createElement('div');
    box.style.cssText='margin-top:12px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.5;'+
      (still.length
        ? 'background:rgba(255,169,77,0.10);border:1px solid rgba(255,169,77,0.4);'
        : 'background:rgba(124,245,196,0.10);border:1px solid rgba(124,245,196,0.4);');
    box.innerHTML = still.length
      ? '<b style="color:#ffa94d">Still to practise:</b> '+still.join(', ')
      : '<b style="color:var(--accent)">All session vocabulary pronounced correctly.</b>';
    list.appendChild(box);
  }

  state.bossIdx++;
  showScreen('screenResults');
  reportToTrainer(won, avg);
}

/* When this game is embedded in Antoch Session Trainer, hand the
   round back to the parent so the feedback note can quote it.
   Standalone, the parent is this window and nothing listens. */
function reportToTrainer(won, avg){
  if(window.parent === window) return;
  try{
    window.parent.postMessage({
      source:'antoch-game', game:'pronunciation',
      won:!!won, average:avg, score:state.score, bestCombo:state.bestCombo,
      results: state.results.map(r=>({word:r.word, pct:r.pct, stars:r.stars,
        attempts:r.attempts, heard:r.heard||'', isVocab:!!r.isVocab}))
    }, '*');
  }catch(e){}
}

/* ============================================================
   EFFECTS HELPERS
   ============================================================ */
function makeProj(from,to,color,onArrive){
  return {x:from.x,y:from.y,fx:from.x,fy:from.y,tx:to.x,ty:to.y,t:0,color,onArrive,spin:0};
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1.2+Math.random()*4.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:36,max:36,color,r:1.6+Math.random()*2.6});
  }
}
function popup(x,y,text,color,size){ popups.push({x,y,text,color,size:size||18,life:56,max:56}); }

/* ============================================================
   BACKGROUND — layered, animated night arena
   ============================================================ */
const stars = Array.from({length:120},()=>({x:Math.random()*W,y:15+Math.random()*250,
  r:0.4+Math.random()*1.6,seed:Math.random()*10}));
const farHills = (()=>{const a=[];let x=-40;while(x<W+40){a.push({x,w:120+Math.random()*180,h:50+Math.random()*70});x+=90+Math.random()*90;}return a;})();
const towers = (()=>{const a=[];let x=-30;while(x<W+30){const w=24+Math.random()*44,h=70+Math.random()*150;
  a.push({x,w,h,roof:16+Math.random()*22,lit:Math.random()<0.7});x+=w+12+Math.random()*34;}return a;})();
const motes = Array.from({length:34},()=>({x:Math.random()*W,y:Math.random()*H,
  r:0.9+Math.random()*2.3,sp:0.12+Math.random()*0.4,drift:(Math.random()-0.5)*0.35,
  seed:Math.random()*10,hue:Math.random()<0.5?150:45}));
let shooting = null, shootTimer = 220;

function drawBackground(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#07031a'); sky.addColorStop(0.42,'#180f3e');
  sky.addColorStop(0.72,'#2a1a54'); sky.addColorStop(1,'#120a2c');
  ctx.fillStyle=sky; ctx.fillRect(-30,-30,W+60,H+60);

  // nebula
  for(let i=0;i<3;i++){
    const cx=180+i*300+Math.sin(t*0.12+i)*30, cy=90+i*22;
    const g=ctx.createRadialGradient(cx,cy,10,cx,cy,150);
    const hue=[280,200,320][i];
    g.addColorStop(0,'hsla('+hue+',70%,60%,0.14)');
    g.addColorStop(1,'hsla('+hue+',70%,60%,0)');
    ctx.fillStyle=g; ctx.fillRect(cx-160,cy-160,320,320);
  }

  // stars
  for(const s of stars){
    ctx.globalAlpha=(0.35+0.65*Math.abs(Math.sin(t*0.6+s.seed)))*0.9;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // shooting star
  if(--shootTimer<0 && !shooting){ shooting={x:Math.random()*W*0.6,y:30+Math.random()*90,t:0}; shootTimer=260+Math.random()*400; }
  if(shooting){
    shooting.t+=0.028;
    const sx=shooting.x+shooting.t*420, sy=shooting.y+shooting.t*150;
    const g=ctx.createLinearGradient(sx-70,sy-25,sx,sy);
    g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,255,255,0.85)');
    ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(sx-70,sy-25); ctx.lineTo(sx,sy); ctx.stroke();
    if(shooting.t>1) shooting=null;
  }

  // moon
  const mx=W-140,my=88;
  const mg=ctx.createRadialGradient(mx,my,12,mx,my,110);
  mg.addColorStop(0,'rgba(200,220,255,0.30)'); mg.addColorStop(1,'rgba(200,220,255,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,110,0,Math.PI*2); ctx.fill();
  const mb=ctx.createRadialGradient(mx-13,my-13,4,mx,my,34);
  mb.addColorStop(0,'#fffaf0'); mb.addColorStop(1,'#c6bfe0');
  ctx.fillStyle=mb; ctx.beginPath(); ctx.arc(mx,my,32,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(150,140,180,0.35)';
  ctx.beginPath(); ctx.arc(mx-9,my-6,6,0,Math.PI*2); ctx.arc(mx+8,my+7,4.5,0,Math.PI*2);
  ctx.arc(mx+4,my-12,3,0,Math.PI*2); ctx.fill();

  // far hills
  ctx.fillStyle='rgba(30,18,64,0.85)';
  for(const h of farHills){
    ctx.beginPath(); ctx.moveTo(h.x,268);
    ctx.quadraticCurveTo(h.x+h.w/2,268-h.h,h.x+h.w,268);
    ctx.closePath(); ctx.fill();
  }

  // skyline
  ctx.fillStyle='rgba(9,4,26,0.92)';
  for(const b of towers){
    ctx.beginPath();
    ctx.moveTo(b.x,272); ctx.lineTo(b.x,272-b.h);
    ctx.lineTo(b.x+b.w/2,272-b.h-b.roof); ctx.lineTo(b.x+b.w,272-b.h);
    ctx.lineTo(b.x+b.w,272); ctx.closePath(); ctx.fill();
  }
  for(const b of towers){
    if(!b.lit||b.h<80) continue;
    const fl=0.45+0.55*Math.abs(Math.sin(t*1.2+b.x));
    ctx.globalAlpha=fl*0.75; ctx.fillStyle='#ffd166';
    ctx.fillRect(b.x+b.w*0.5-2,272-b.h*0.55-3,4,7);
    ctx.globalAlpha=1;
  }

  // horizon haze
  const hz=ctx.createLinearGradient(0,236,0,290);
  hz.addColorStop(0,'rgba(124,245,196,0)'); hz.addColorStop(1,'rgba(124,245,196,0.16)');
  ctx.fillStyle=hz; ctx.fillRect(-30,236,W+60,58);

  // arena platform
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(W*0.5-520,H+30); ctx.lineTo(W*0.5+520,H+30);
  ctx.lineTo(W*0.5+165,276); ctx.lineTo(W*0.5-165,276);
  ctx.closePath(); ctx.clip();
  const fg=ctx.createLinearGradient(0,276,0,H+30);
  fg.addColorStop(0,'#2b1f52'); fg.addColorStop(1,'#0d0722');
  ctx.fillStyle=fg; ctx.fillRect(-30,260,W+60,H);
  for(let i=-7;i<=7;i++){
    ctx.beginPath(); ctx.moveTo(W*0.5+i*28,276); ctx.lineTo(W*0.5+i*165,H+30);
    ctx.strokeStyle='rgba(180,150,255,0.10)'; ctx.lineWidth=1; ctx.stroke();
  }
  for(let j=0;j<7;j++){
    const y=276+j*j*7+j*16;
    ctx.beginPath(); ctx.moveTo(W*0.5-170-j*46,y); ctx.lineTo(W*0.5+170+j*46,y);
    ctx.strokeStyle='rgba(180,150,255,'+Math.max(0,0.11-j*0.013)+')'; ctx.stroke();
  }
  ctx.restore();

  runeCircle(heroPos().x, heroPos().y+70, 66, '#7cf5c4', t);
  runeCircle(bossPos().x, bossPos().y+102, 84, 'hsl('+state.boss.hue+',80%,62%)', -t);

  for(const m of motes){
    m.y-=m.sp; m.x+=Math.sin(t+m.seed)*m.drift;
    if(m.y<70){ m.y=H-10; m.x=Math.random()*W; }
    ctx.globalAlpha=(0.35+0.65*Math.abs(Math.sin(t*1.5+m.seed)))*0.6;
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
    ctx.fillStyle='hsl('+m.hue+',90%,76%)';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=7; ctx.fill(); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

function runeCircle(cx,cy,r,color,t){
  ctx.save(); ctx.translate(cx,cy); ctx.scale(1,0.33); ctx.globalAlpha=0.5;
  for(let i=0;i<2;i++){
    ctx.beginPath(); ctx.arc(0,0,r-i*15,0,Math.PI*2);
    ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.shadowColor=color; ctx.shadowBlur=15; ctx.stroke();
  }
  ctx.rotate(t*0.45);
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2;
    ctx.moveTo(Math.cos(a)*(r-4),Math.sin(a)*(r-4));
    ctx.lineTo(Math.cos(a)*(r-23),Math.sin(a)*(r-23));
  }
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0; ctx.restore(); ctx.globalAlpha=1;
}

function vignette(){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.34,W/2,H/2,H*0.88);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=g; ctx.fillRect(-30,-30,W+60,H+60);
}

/* ============================================================
   HERO — the Sentence Seeker
   ============================================================ */
function drawHero(t){
  const p=heroPos(), bob=Math.sin(heroAnim.bob)*4.5, lunge=heroAnim.cast*26;
  ctx.save();
  ctx.translate(p.x+lunge,p.y+bob);
  if(heroAnim.hit>0.05) ctx.translate((Math.random()-0.5)*heroAnim.hit*11,(Math.random()-0.5)*heroAnim.hit*11);

  ctx.beginPath(); ctx.ellipse(0,80,46,11,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();

  // owl familiar
  ctx.save();
  const wing=Math.sin(t*4)*0.5;
  ctx.translate(-52,-66+Math.sin(heroAnim.bob*1.4)*4);
  ctx.save(); ctx.rotate(-wing);
  ctx.beginPath(); ctx.ellipse(-13,0,9,5,0.4,0,Math.PI*2); ctx.fillStyle='#c9a35a'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(wing);
  ctx.beginPath(); ctx.ellipse(13,0,9,5,-0.4,0,Math.PI*2); ctx.fillStyle='#c9a35a'; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.ellipse(0,0,12,14,0,0,Math.PI*2); ctx.fillStyle='#ece4d6'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-9,-11); ctx.lineTo(-5,-19); ctx.lineTo(-1,-10); ctx.closePath();
  ctx.moveTo(9,-11); ctx.lineTo(5,-19); ctx.lineTo(1,-10); ctx.closePath();
  ctx.fillStyle='#c9a35a'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-4,-2,4,0,Math.PI*2); ctx.arc(4,-2,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1a10'; ctx.beginPath(); ctx.arc(-4,-2,2.2,0,Math.PI*2); ctx.arc(4,-2,2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.moveTo(-2.5,3); ctx.lineTo(2.5,3); ctx.lineTo(0,8); ctx.closePath(); ctx.fill();
  ctx.restore();

  // cape (waving)
  ctx.beginPath(); ctx.moveTo(-16,-32);
  for(let i=0;i<=6;i++){
    const yy=-32+i*15, xx=-20-Math.sin(t*2.2+i*0.5)*(4+i*1.6)-i*1.5;
    ctx.lineTo(xx,yy);
  }
  ctx.lineTo(2,52); ctx.lineTo(-1,-34); ctx.closePath();
  const cg=ctx.createLinearGradient(-34,-32,4,58);
  cg.addColorStop(0,'#ff6b80'); cg.addColorStop(1,'#7d2340');
  ctx.fillStyle=cg; ctx.fill();

  ctx.fillStyle='#3a2c22';
  ctx.beginPath(); ctx.roundRect(-15,46,11,28,4); ctx.fill();
  ctx.beginPath(); ctx.roundRect(5,46,11,28,4); ctx.fill();
  ctx.fillStyle='#241a14';
  ctx.beginPath(); ctx.roundRect(-18,70,16,7,3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(4,70,16,7,3); ctx.fill();

  // robe
  ctx.beginPath();
  ctx.moveTo(-21,-8); ctx.lineTo(21,-8); ctx.lineTo(28,52); ctx.lineTo(-28,52); ctx.closePath();
  const rg=ctx.createLinearGradient(0,-8,0,52);
  rg.addColorStop(0,'#3a4a7e'); rg.addColorStop(1,'#141e3e');
  ctx.fillStyle=rg; ctx.fill();
  ctx.strokeStyle='rgba(255,209,102,0.85)'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(-21,14); ctx.lineTo(26,14); ctx.stroke();
  ctx.strokeStyle='rgba(255,209,102,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-3,14); ctx.lineTo(-3,52); ctx.stroke();

  // spellbook
  ctx.save();
  ctx.translate(24,10); ctx.rotate(-0.32-heroAnim.cast*0.5);
  const gl=18+heroAnim.cast*22;
  const gg=ctx.createRadialGradient(0,0,2,0,0,gl+16);
  gg.addColorStop(0,'rgba(124,245,196,'+(0.5+heroAnim.cast*0.4)+')');
  gg.addColorStop(1,'rgba(124,245,196,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(0,0,gl+16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c9962e'; ctx.beginPath(); ctx.roundRect(-15,-12,30,24,3); ctx.fill();
  ctx.fillStyle='#f6ecd2'; ctx.beginPath(); ctx.roundRect(-13,-10,12,20,2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(1,-10,12,20,2); ctx.fill();
  ctx.strokeStyle='#a9781f'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,12); ctx.stroke();
  ctx.fillStyle='#7cf5c4'; ctx.font='700 11px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('AB',-7,1); ctx.fillText('C',7,1);
  // orbiting runes while casting
  for(let i=0;i<3;i++){
    const a=t*3+i*2.1, rr=22+heroAnim.cast*14;
    ctx.globalAlpha=0.45+heroAnim.cast*0.5;
    ctx.fillStyle='#7cf5c4';
    ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr*0.6,2.4,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  ctx.strokeStyle='#1b2748'; ctx.lineWidth=10; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(14,2); ctx.lineTo(24,14); ctx.stroke();

  // head
  ctx.beginPath(); ctx.ellipse(2,-28,19,20,0,0,Math.PI*2);
  const hg=ctx.createRadialGradient(-5,-35,4,2,-28,24);
  hg.addColorStop(0,'#ffdcbb'); hg.addColorStop(1,'#e0a06a');
  ctx.fillStyle=hg; ctx.fill();
  ctx.fillStyle='#e8b98d';
  ctx.beginPath(); ctx.ellipse(-16,-27,4,6,0,0,Math.PI*2); ctx.fill();

  // hair
  ctx.fillStyle='#33200f';
  ctx.beginPath();
  ctx.moveTo(-18,-33);
  ctx.quadraticCurveTo(-6,-56,15,-45);
  ctx.quadraticCurveTo(25,-40,20,-30);
  ctx.quadraticCurveTo(12,-43,1,-36);
  ctx.quadraticCurveTo(-8,-43,-18,-33);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(12,-44); ctx.quadraticCurveTo(24,-50,22,-38);
  ctx.quadraticCurveTo(18,-44,12,-44); ctx.closePath(); ctx.fill();

  // face
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-5,-27,4.2,3.4,0,0,Math.PI*2);
  ctx.ellipse(8,-27,4.2,3.4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a1a3e';
  ctx.beginPath(); ctx.arc(-4.4,-27,2.3,0,Math.PI*2); ctx.arc(8.6,-27,2.3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#33200f'; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-9,-33); ctx.lineTo(-1,-34);
  ctx.moveTo(5,-34); ctx.lineTo(13,-33); ctx.stroke();
  ctx.strokeStyle='#a35c38'; ctx.lineWidth=1.7;
  ctx.beginPath(); ctx.arc(2,-20,5.5,0.12*Math.PI,0.88*Math.PI); ctx.stroke();

  ctx.restore();
}

/* ============================================================
   BOSSES
   ============================================================ */
function bfill(hue,s1,l1,s2,l2){
  const g=ctx.createRadialGradient(-22,-14,10,0,22,86);
  g.addColorStop(0, bossAnim.hit>0.1?'#fff':'hsl('+hue+','+s1+'%,'+l1+'%)');
  g.addColorStop(1,'hsl('+hue+','+s2+'%,'+l2+'%)');
  return g;
}
function eye(x,y,r,hue){
  ctx.beginPath(); ctx.arc(x,y,r+5,0,Math.PI*2); ctx.fillStyle='#0a0418'; ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle= bossAnim.hit>0.1?'#ff5d73':'hsl('+hue+',92%,76%)';
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=13; ctx.fill(); ctx.shadowBlur=0;
}
function fangs(y,hw,n){
  ctx.beginPath(); ctx.moveTo(-hw,y);
  for(let i=0;i<n;i++) ctx.lineTo(-hw+(i+1)*(hw*2/n), y+(i%2===0?10:0));
  ctx.closePath(); ctx.fillStyle='#12061f'; ctx.fill();
}

function drawBoss(t){
  const p=bossPos(), b=state.boss, hue=b.hue;
  const bob=Math.sin(bossAnim.bob)*6, lunge=-bossAnim.lunge*30;
  const sc=1-bossAnim.dead*0.92, fade=1-bossAnim.dead;
  ctx.save(); ctx.globalAlpha=fade;
  ctx.translate(p.x+lunge,p.y+bob); ctx.scale(sc,sc);
  if(bossAnim.hit>0.05) ctx.translate((Math.random()-0.5)*bossAnim.hit*16,(Math.random()-0.5)*bossAnim.hit*16);

  ctx.beginPath(); ctx.ellipse(0,100,68,15,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();

  switch(b.type){
    case 'wraith':
      ctx.globalAlpha*=0.93;
      ctx.beginPath(); ctx.moveTo(0,-34);
      ctx.quadraticCurveTo(-56,12,-44,78);
      for(let i=0;i<4;i++){ const xx=-44+i*30; ctx.quadraticCurveTo(xx+10,68+Math.sin(t*2+i)*7,xx+22,78); }
      ctx.quadraticCurveTo(56,12,0,-34); ctx.closePath();
      ctx.fillStyle=bfill(hue,48,58,52,16); ctx.fill();
      ctx.fillStyle='hsl('+hue+',52%,11%)';
      ctx.beginPath(); ctx.ellipse(0,-36,30,8,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-15,-36); ctx.lineTo(-10,-78); ctx.lineTo(10,-78); ctx.lineTo(15,-36); ctx.closePath(); ctx.fill();
      ctx.fillStyle='hsl('+hue+',60%,45%)'; ctx.fillRect(-15,-46,30,5);
      eye(-11,-12,6,hue); eye(11,-12,6,hue);
      break;

    case 'troll':
      ctx.save(); ctx.translate(56,8); ctx.rotate(0.5+Math.sin(t*1.5)*0.08);
      ctx.fillStyle='hsl('+(hue-12)+',30%,28%)'; ctx.fillRect(-7,-10,14,66);
      ctx.beginPath(); ctx.arc(0,-18,18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='hsl('+(hue-12)+',25%,38%)';
      for(let i=0;i<5;i++){ const a=i*1.26; ctx.beginPath();
        ctx.arc(Math.cos(a)*11,-18+Math.sin(a)*11,3.4,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(0,28,62,54,0,0,Math.PI*2);
      ctx.fillStyle=bfill(hue,42,48,36,22); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',50%,11%)'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='hsl('+hue+',30%,58%)';
      ctx.beginPath(); ctx.ellipse(0,50,26,16,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#f4ecd8';
      ctx.beginPath(); ctx.moveTo(-20,36); ctx.lineTo(-27,55); ctx.lineTo(-13,42); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(20,36); ctx.lineTo(27,55); ctx.lineTo(13,42); ctx.closePath(); ctx.fill();
      eye(-18,-4,7,hue); eye(18,-4,7,hue);
      ctx.strokeStyle='#12061f'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-28,-18); ctx.lineTo(-9,-12);
      ctx.moveTo(28,-18); ctx.lineTo(9,-12); ctx.stroke();
      break;

    case 'ghost':
      ctx.globalAlpha*=0.78;
      ctx.beginPath(); ctx.moveTo(-48,14);
      ctx.quadraticCurveTo(-52,-54,0,-56); ctx.quadraticCurveTo(52,-54,48,14);
      for(let i=0;i<5;i++){ const wx=48-i*(96/5);
        ctx.quadraticCurveTo(wx-10,38+Math.sin(t*3+i)*8,wx-19,14); }
      ctx.closePath();
      ctx.fillStyle=bfill(hue,55,72,48,42); ctx.fill();
      ctx.globalAlpha*=0.9;
      eye(-15,-16,7,hue); eye(15,-16,7,hue);
      ctx.beginPath(); ctx.ellipse(0,6,9,12,0,0,Math.PI*2);
      ctx.fillStyle='rgba(10,4,24,0.65)'; ctx.fill();
      break;

    case 'slime': {
      const sq=1+Math.sin(t*2.4)*0.05;
      ctx.save(); ctx.scale(sq,2-sq);
      ctx.beginPath(); ctx.ellipse(0,22,64,56,0,0,Math.PI*2);
      ctx.fillStyle=bfill(hue,82,58,72,28); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',62%,16%)'; ctx.lineWidth=3; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-24,-6,14,10,-0.4,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.fill();
      eye(-20,2,10,hue); eye(20,2,10,hue);
      fangs(40,28,6);
      ctx.restore();
      break;
    }

    case 'vampire':
      ctx.beginPath();
      ctx.moveTo(-15,-26); ctx.lineTo(-48,-4); ctx.lineTo(-17,5); ctx.lineTo(0,-15);
      ctx.lineTo(17,5); ctx.lineTo(48,-4); ctx.lineTo(15,-26); ctx.closePath();
      ctx.fillStyle='hsl('+hue+',62%,22%)'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-26,-6);
      ctx.quadraticCurveTo(-44,42,-20,78); ctx.lineTo(20,78);
      ctx.quadraticCurveTo(44,42,26,-6); ctx.closePath();
      ctx.fillStyle=bfill(hue,42,34,36,14); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-17,21,21,0,0,Math.PI*2);
      ctx.fillStyle='#ecd3b6'; ctx.fill();
      ctx.fillStyle='#1a0f22';
      ctx.beginPath(); ctx.moveTo(-21,-26); ctx.quadraticCurveTo(0,-42,21,-26);
      ctx.quadraticCurveTo(10,-30,0,-22); ctx.quadraticCurveTo(-10,-30,-21,-26); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#c0202f';
      ctx.beginPath(); ctx.arc(-7,-17,2.8,0,Math.PI*2); ctx.arc(7,-17,2.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.moveTo(-5,-5); ctx.lineTo(-2,4); ctx.lineTo(-8,4); ctx.closePath();
      ctx.moveTo(5,-5); ctx.lineTo(8,4); ctx.lineTo(2,4); ctx.closePath(); ctx.fill();
      break;

    case 'robot':
      ctx.strokeStyle='hsl('+hue+',42%,58%)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(0,-68); ctx.lineTo(0,-48); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-72,7,0,Math.PI*2);
      ctx.fillStyle='hsl('+hue+',85%,'+(58+Math.sin(t*5)*12)+'%)';
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=14; ctx.fill(); ctx.shadowBlur=0;
      ctx.beginPath(); ctx.roundRect(-48,-48,96,86,14);
      ctx.fillStyle=bfill(hue,36,48,30,20); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',50%,14%)'; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle='hsl('+hue+',28%,30%)';
      ctx.beginPath(); ctx.roundRect(-62,-10,14,38,5); ctx.fill();
      ctx.beginPath(); ctx.roundRect(48,-10,14,38,5); ctx.fill();
      ctx.fillStyle='#08040f';
      ctx.beginPath(); ctx.roundRect(-32,-32,28,20,5); ctx.roundRect(4,-32,28,20,5); ctx.fill();
      {const ec= bossAnim.hit>0.1?'#ff5d73':'hsl('+hue+',92%,72%)';
       ctx.fillStyle=ec; ctx.shadowColor=ec; ctx.shadowBlur=11;
       ctx.beginPath(); ctx.roundRect(-28,-27,19,10,3); ctx.roundRect(9,-27,19,10,3); ctx.fill(); ctx.shadowBlur=0;}
      ctx.strokeStyle='#08040f'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(-18,16); ctx.lineTo(18,16); ctx.stroke();
      for(let i=0;i<4;i++){ ctx.fillStyle='rgba(255,255,255,0.12)';
        ctx.fillRect(-16+i*10,4,5,5); }
      break;

    case 'dragon':
      ctx.save(); ctx.rotate(Math.sin(t*1.6)*0.05);
      ctx.beginPath(); ctx.moveTo(-22,-12); ctx.lineTo(-70,-46); ctx.lineTo(-58,-6); ctx.lineTo(-32,12); ctx.closePath();
      ctx.moveTo(22,-12); ctx.lineTo(70,-46); ctx.lineTo(58,-6); ctx.lineTo(32,12); ctx.closePath();
      ctx.fillStyle='hsl('+hue+',62%,26%)'; ctx.fill();
      ctx.strokeStyle='hsl('+hue+',60%,16%)'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(0,22,52,48,0,0,Math.PI*2);
      ctx.fillStyle=bfill(hue,58,52,52,26); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',60%,14%)'; ctx.lineWidth=3; ctx.stroke();
      for(let i=0;i<2;i++){ const hx=-16+i*32;
        ctx.beginPath(); ctx.moveTo(hx-8,-30); ctx.lineTo(hx,-62); ctx.lineTo(hx+8,-30);
        ctx.closePath(); ctx.fillStyle='hsl('+hue+',42%,72%)'; ctx.fill(); }
      eye(-16,0,8,hue); eye(16,0,8,hue);
      fangs(38,24,5);
      ctx.fillStyle='rgba(255,120,40,'+(0.3+0.25*Math.abs(Math.sin(t*3)))+')';
      ctx.beginPath(); ctx.ellipse(0,46,16,7,0,0,Math.PI*2); ctx.fill();
      break;

    case 'witch':
      ctx.beginPath(); ctx.moveTo(-32,-8);
      ctx.quadraticCurveTo(-40,46,-18,74); ctx.lineTo(18,74);
      ctx.quadraticCurveTo(40,46,32,-8); ctx.closePath();
      ctx.fillStyle=bfill(hue,48,42,40,18); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-17,20,20,0,0,Math.PI*2);
      ctx.fillStyle='#bfe08c'; ctx.fill();
      ctx.fillStyle='hsl('+hue+',60%,14%)';
      ctx.beginPath(); ctx.ellipse(0,-24,33,8,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-15,-28);
      ctx.quadraticCurveTo(2,-58,8,-84); ctx.quadraticCurveTo(14,-56,15,-26); ctx.closePath(); ctx.fill();
      ctx.fillStyle='hsl('+hue+',70%,58%)';
      ctx.beginPath(); ctx.ellipse(0,-30,12,4,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1a0f22';
      ctx.beginPath(); ctx.arc(-7,-18,2.8,0,Math.PI*2); ctx.arc(7,-18,2.8,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4,-8); ctx.lineTo(4,-8); ctx.lineTo(0,-2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#8b6a3a'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(30,-4); ctx.lineTo(46,-46); ctx.stroke();
      ctx.fillStyle='hsl('+hue+',80%,'+(62+Math.sin(t*4)*10)+'%)';
      ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(47,-49,7,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      break;

    case 'knight':
      ctx.save(); ctx.translate(50,-8); ctx.rotate(-0.5+Math.sin(t*1.4)*0.06);
      ctx.strokeStyle='#d6dce6'; ctx.lineWidth=6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,-52); ctx.lineTo(0,22); ctx.stroke();
      ctx.strokeStyle='#8a93a3'; ctx.lineWidth=11;
      ctx.beginPath(); ctx.moveTo(-14,-4); ctx.lineTo(14,-4); ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.roundRect(-44,-16,88,74,16);
      ctx.fillStyle=bfill(hue,32,38,26,16); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',30%,9%)'; ctx.lineWidth=3; ctx.stroke();
      ctx.beginPath(); ctx.arc(-38,-10,13,0,Math.PI*2); ctx.arc(38,-10,13,0,Math.PI*2);
      ctx.fillStyle='hsl('+hue+',30%,48%)'; ctx.fill();
      ctx.fillStyle='hsl('+hue+',35%,30%)';
      ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(20,4); ctx.lineTo(0,34); ctx.lineTo(-20,4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-38,19,21,0,0,Math.PI*2); ctx.fillStyle='#e9edf2'; ctx.fill();
      ctx.fillStyle='#08040f';
      ctx.beginPath(); ctx.arc(-7,-40,4.4,0,Math.PI*2); ctx.arc(7,-40,4.4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='hsl('+hue+',85%,70%)';
      ctx.beginPath(); ctx.arc(-7,-40,2,0,Math.PI*2); ctx.arc(7,-40,2,0,Math.PI*2); ctx.fill();
      ctx.save(); ctx.translate(0,-24); fangs(0,11,4); ctx.restore();
      break;

    case 'book':
      ctx.save(); ctx.rotate(-0.09+Math.sin(t*2)*0.03);
      ctx.beginPath(); ctx.moveTo(0,-50); ctx.lineTo(-60,-36); ctx.lineTo(-60,48); ctx.lineTo(0,62); ctx.closePath();
      ctx.fillStyle=bfill(hue,58,52,46,24); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',60%,14%)'; ctx.lineWidth=3; ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.rotate(0.09-Math.sin(t*2)*0.03);
      ctx.beginPath(); ctx.moveTo(0,-50); ctx.lineTo(60,-36); ctx.lineTo(60,48); ctx.lineTo(0,62); ctx.closePath();
      ctx.fillStyle=bfill(hue,48,42,36,18); ctx.fill();
      ctx.strokeStyle='hsl('+hue+',60%,14%)'; ctx.lineWidth=3; ctx.stroke();
      ctx.restore();
      eye(0,-16,9,hue);
      ctx.beginPath(); ctx.ellipse(0,32,28,17,0,0,Math.PI*2); ctx.fillStyle='#b8283e'; ctx.fill();
      ctx.fillStyle='#fff';
      for(let i=-2;i<=2;i++){ ctx.beginPath();
        ctx.moveTo(i*11-4,20); ctx.lineTo(i*11+4,20); ctx.lineTo(i*11,32); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle='#e0566e';
      ctx.beginPath(); ctx.ellipse(0,44+Math.sin(t*4)*3,11,7,0,0,Math.PI*2); ctx.fill();
      break;

    default:
      ctx.beginPath(); ctx.ellipse(0,22,62,54,0,0,Math.PI*2);
      ctx.fillStyle=bfill(hue,80,56,70,28); ctx.fill();
      eye(-20,2,10,hue); eye(20,2,10,hue); fangs(38,28,6);
  }
  ctx.restore(); ctx.globalAlpha=1;
}

/* ============================================================
   HUD
   ============================================================ */
function hpBar(x,y,w,h,pct,cols,label){
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.roundRect(-3,-3,w+6,h+6,(h+6)/2);
  ctx.fillStyle='rgba(10,4,24,0.75)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.roundRect(0,0,w,h,h/2);
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fill();
  const fw=Math.max(0,Math.min(1,pct))*w;
  if(fw>0){
    ctx.save(); ctx.beginPath(); ctx.roundRect(0,0,fw,h,h/2); ctx.clip();
    const g=ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0,cols[0]); g.addColorStop(1,cols[1]);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fillRect(0,0,w,h*0.42);
    ctx.restore();
  }
  for(let i=1;i<5;i++){ ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(w*i/5,0); ctx.lineTo(w*i/5,h); ctx.stroke(); }
  ctx.fillStyle='#fff'; ctx.font='700 12px Segoe UI';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=4;
  ctx.fillText(label,8,h/2+0.5); ctx.shadowBlur=0;
  ctx.restore();
}

function drawWordCard(t){
  const e = current();
  const cx=W/2, cy=482;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(cx-320,cy-56,640,112,18);
  ctx.fillStyle='rgba(14,7,32,0.72)'; ctx.fill();
  ctx.strokeStyle='rgba(124,92,200,0.5)'; ctx.lineWidth=2; ctx.stroke();

  ctx.textAlign='center';
  ctx.font='600 11px Segoe UI'; ctx.fillStyle= e.isVocab? '#ffd166':'#a996d6';
  ctx.fillText((e.isVocab?'VOCABULARY · ':'')+e.rule.name.toUpperCase(), cx, cy-36);

  const pulse = listening? 1+Math.sin(t*7)*0.03 : 1;
  ctx.save(); ctx.translate(cx,cy-6); ctx.scale(pulse,pulse);
  ctx.font='700 44px Segoe UI'; ctx.textBaseline='middle';
  ctx.fillStyle= listening? '#ffe9a8':'#f3eeff';
  ctx.shadowColor= listening? '#ffd166':'#7cf5c4'; ctx.shadowBlur=26;
  ctx.fillText(e.word,0,0); ctx.shadowBlur=0; ctx.restore();

  // meaning line for vocabulary, respelling/tip for drill words
  if(e.isVocab && e.meaning){
    ctx.font='italic 500 13px Segoe UI'; ctx.fillStyle='#c9b8f0';
    const mm = e.meaning.length>72 ? e.meaning.slice(0,70)+'…' : e.meaning;
    ctx.fillText(mm, cx, cy+20);
    if(e.respell){
      ctx.font='600 13px Segoe UI'; ctx.fillStyle='#7cf5c4';
      ctx.fillText('say it like:  '+e.respell, cx, cy+38);
    }
  }else if(e.respell){
    ctx.font='600 15px Segoe UI'; ctx.fillStyle='#7cf5c4';
    ctx.fillText('say it like:  '+e.respell, cx, cy+28);
  }else{
    ctx.font='500 12.5px Segoe UI'; ctx.fillStyle='#9d8dc4';
    const tip = e.rule.tip.length>76 ? e.rule.tip.slice(0,74)+'…' : e.rule.tip;
    ctx.fillText(tip, cx, cy+28);
  }

  // attempt dots — shows how many tries are left on THIS word
  const ax=cx+250;
  for(let i=0;i<MAX_ATTEMPTS;i++){
    ctx.beginPath(); ctx.arc(ax+i*13, cy-36, 4, 0, Math.PI*2);
    ctx.fillStyle = i<state.attempt ? '#ff5d73' : 'rgba(255,255,255,0.28)';
    ctx.fill();
  }

  // progress pips
  const n=state.entries.length, sp=Math.min(26,560/Math.max(1,n));
  const sx=cx-(n-1)*sp/2;
  for(let i=0;i<n;i++){
    const done = state.results[i];
    ctx.beginPath(); ctx.arc(sx+i*sp, cy+52, 5, 0, Math.PI*2);
    ctx.fillStyle = done ? (done.stars>=2?'#7cf5c4':done.stars===1?'#ffa94d':'#ff5d73')
                  : (i===state.idx?'#ffd166':'rgba(255,255,255,0.22)');
    ctx.fill();
  }
  ctx.restore();
}

function drawHUD(){
  hpBar(56,44,250,20, state.heroShown/state.heroMax, ['#8ffcd0','#3fae7f'],
        'SENTENCE SEEKER  '+Math.max(0,Math.round(state.heroHP)));
  hpBar(W-306,44,250,20, state.bossShown/state.bossMax, ['#ffb35d','#ff5d73'],
        state.boss.name.toUpperCase()+'  '+Math.max(0,Math.round(state.bossHP)));
  ctx.textAlign='center'; ctx.font='700 13px Segoe UI'; ctx.fillStyle='#ffd166';
  ctx.fillText('SCORE '+state.score, W/2, 52);
  if(state.combo>1){
    ctx.font='700 15px Segoe UI'; ctx.fillStyle='#ffd166';
    ctx.fillText('COMBO x'+state.combo, W/2, 72);
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function update(){
  heroAnim.bob+=0.05; bossAnim.bob+=0.045;
  heroAnim.hit*=0.86; bossAnim.hit*=0.86;
  heroAnim.cast*=0.88; bossAnim.lunge*=0.88;
  if(bossAnim.dead>0 && bossAnim.dead<1) bossAnim.dead=Math.min(1,bossAnim.dead+0.02);
  shake*=0.86;
  state.heroShown += (state.heroHP-state.heroShown)*0.12;
  state.bossShown += (state.bossHP-state.bossShown)*0.12;

  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i]; p.t+=0.065; p.spin+=0.3;
    if(p.t>=1){ p.onArrive(); projectiles.splice(i,1); }
    else{
      const arc=Math.sin(p.t*Math.PI)*-70;
      p.x=p.fx+(p.tx-p.fx)*p.t; p.y=p.fy+(p.ty-p.fy)*p.t+arc;
      if(Math.random()<0.7) particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*0.7,
        vy:(Math.random()-0.5)*0.7,life:16,max:16,color:p.color,r:1.4+Math.random()*1.6});
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i]; q.x+=q.vx; q.y+=q.vy; q.vy+=0.08; q.life--;
    if(q.life<=0) particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const u=popups[i]; u.y-=0.75; u.life--;
    if(u.life<=0) popups.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i]; r.r+=(r.max-r.r)*0.16; r.life--;
    if(r.life<=0) rings.splice(i,1);
  }
}

function render(){
  const t=performance.now()*0.001;
  ctx.save();
  ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.clearRect(-30,-30,W+60,H+60);
  drawBackground(t);
  drawHero(t);
  drawBoss(t);
  drawHUD();

  for(const r of rings){
    ctx.globalAlpha=Math.max(0,r.life/26)*0.7;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=r.color; ctx.lineWidth=3; ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const p of projectiles){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin);
    ctx.shadowColor=p.color; ctx.shadowBlur=22;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    for(let i=0;i<4;i++){ const a=i*Math.PI/2;
      ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);
      ctx.lineTo(Math.cos(a+Math.PI/4)*4.5,Math.sin(a+Math.PI/4)*4.5); }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur=0; ctx.restore();
  }
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,Math.PI*2);
    ctx.fillStyle=q.color; ctx.fill(); ctx.globalAlpha=1;
  }
  for(const u of popups){
    const k=u.life/u.max;
    ctx.globalAlpha=Math.max(0,k);
    ctx.font='700 '+(u.size*(1+(1-k)*0.25))+'px Segoe UI'; ctx.textAlign='center';
    ctx.fillStyle=u.color;
    ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=6;
    ctx.fillText(u.text,u.x,u.y); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  if(state.entries.length) drawWordCard(t);
  vignette();
  ctx.restore();
}

function loop(){ update(); render(); requestAnimationFrame(loop); }

/* ============================================================
   BOOT — a shared link starts the round immediately
   ============================================================ */
(function boot(){
  const shared = decodeRound(location.hash);
  if(shared){
    document.getElementById('wordsInput').value = shared.words.join(', ');
    document.getElementById('vocabInput').value =
      shared.vocab.map(v=>v.meaning? v.word+' = '+v.meaning : v.word).join('\n');
    buildRound(shared.words, shared.vocab);
    showScreen('screenBattle');
    warmUpMic();
    setStatus('Your trainer picked these — tap the mic and say the first one');
  }else{
    buildRound(['water','better','little'], []);   // harmless default so canvas has state
    state.running=false;
  }
  loop();
})();
</script>

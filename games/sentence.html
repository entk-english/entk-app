<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Seeker — Sentence Structure Battle</title>
<style>
  :root{
    --bg1:#150c30; --bg2:#080418;
    --panel:rgba(40,24,74,0.72); --panel-border:rgba(124,92,200,0.45);
    --accent:#7cf5c4; --accent2:#ffd166; --danger:#ff5d73; --gold:#ffc94d;
    --text:#f3eeff; --muted:#a996d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg2);
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);overflow:hidden;
    -webkit-font-smoothing:antialiased;}
  body::before{content:'';position:fixed;inset:0;z-index:-2;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,#2a1a5c,transparent 70%),
               radial-gradient(ellipse 60% 50% at 80% 100%,#1d2a5e,transparent 70%),
               linear-gradient(180deg,#150c30,#080418);}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:20px;overflow-y:auto;}
  .screen.active{display:flex;}
  #setupCard,#resultsCard{width:min(680px,94vw);background:var(--panel);
    border:1px solid var(--panel-border);border-radius:20px;padding:28px 30px;
    backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  #resultsCard{max-height:88vh;overflow-y:auto;}
  .brand{text-align:center;margin-bottom:22px;}
  .brand h1{margin:0;font-size:30px;letter-spacing:-0.5px;
    background:linear-gradient(120deg,#fff,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{margin:6px 0 0;color:var(--muted);font-size:13px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:1px;font-weight:600;}
  textarea{width:100%;background:rgba(10,4,26,0.7);border:1px solid var(--panel-border);
    color:var(--text);border-radius:10px;padding:12px 14px;font-size:15px;
    font-family:inherit;outline:none;min-height:86px;resize:vertical;line-height:1.5;}
  textarea:focus{border-color:var(--accent);}
  .btn{background:linear-gradient(180deg,#8ffcd0,#3fae7f);border:none;color:#06251a;
    font-weight:700;font-size:15px;padding:13px 28px;border-radius:11px;cursor:pointer;
    box-shadow:0 4px 0 #2b8a64;transition:transform .06s,box-shadow .06s;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b8a64;}
  .btn.ghost{background:rgba(255,255,255,0.07);color:var(--text);
    border:1px solid var(--panel-border);box-shadow:none;}
  .btn.gold{background:linear-gradient(180deg,#ffe08a,#e0a520);color:#3a2600;box-shadow:0 4px 0 #a87610;}
  .btnRow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
  .chip{background:rgba(124,245,196,0.12);border:1px solid rgba(124,245,196,0.35);
    color:var(--accent);font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;}
  .chip:hover{background:rgba(124,245,196,0.22);}
  #shareBox{margin-top:14px;padding:13px 15px;background:rgba(255,201,77,0.08);
    border:1px solid rgba(255,201,77,0.35);border-radius:11px;display:none;}
  #shareBox.show{display:block;}
  #shareBox .lbl{font-size:11px;color:var(--gold);text-transform:uppercase;
    letter-spacing:1px;font-weight:700;margin-bottom:7px;}
  #shareUrl{width:100%;font-size:11px;background:rgba(0,0,0,0.35);color:var(--muted);
    border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:8px 10px;
    font-family:ui-monospace,monospace;}
  .miniBtn{background:rgba(255,255,255,0.08);border:1px solid var(--panel-border);
    color:var(--text);font-size:12px;padding:8px 15px;border-radius:9px;cursor:pointer;}
  .miniBtn:hover{background:rgba(255,255,255,0.16);}
  canvas{border-radius:18px;display:block;max-width:96vw;max-height:70vh;cursor:pointer;
    box-shadow:0 24px 70px rgba(0,0,0,0.65), 0 0 0 1px rgba(124,92,200,0.4);}
  #statusLine{text-align:center;font-size:14px;color:var(--muted);min-height:20px;max-width:700px;}
  #statusLine b{color:var(--accent2);}
  #resultsCard h2{margin:0 0 4px;font-size:26px;text-align:center;}
  #resultsSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px;}
  .sentRow{padding:11px 13px;border-radius:11px;background:rgba(255,255,255,0.04);margin-bottom:8px;}
  .sentRow .s{font-weight:700;font-size:15px;}
  .sentRow .m{font-size:12px;color:var(--muted);margin-top:3px;}
</style>
</head>
<body>

<div class="screen active" id="screenSetup">
  <div id="setupCard">
    <div class="brand">
      <h1>Sentence Seeker</h1>
      <p>Sentence Structure Battle — put the words in order to strike</p>
    </div>
    <div class="field">
      <label for="sentInput">Sentences to practise (one per line)</label>
      <textarea id="sentInput" placeholder="The cat chases the mouse&#10;She walked to school yesterday"></textarea>
      <div class="chips" id="presetChips"></div>
    </div>
    <div class="btnRow">
      <button class="btn" id="startBtn">⚔ Generate battle</button>
      <button class="btn ghost" id="shareBtn">🔗 Create trainee link</button>
    </div>
    <div id="shareBox">
      <div class="lbl">Send this to your trainee</div>
      <input id="shareUrl" readonly>
      <div style="margin-top:9px;display:flex;gap:8px;">
        <button class="miniBtn" id="copyBtn">Copy link</button>
        <span style="font-size:11px;color:var(--muted);align-self:center;">
          Works once this file is hosted online.
        </span>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="screenBattle">
  <canvas id="game" width="960" height="620"></canvas>
  <div id="statusLine">Click the words in the correct order</div>
  <button class="miniBtn" id="quitBtn">✕ Exit</button>
</div>

<div class="screen" id="screenResults">
  <div id="resultsCard">
    <h2 id="resultsTitle">Victory!</h2>
    <div id="resultsSub"></div>
    <div id="resultsList"></div>
    <div class="btnRow" style="margin-top:18px;justify-content:center;">
      <button class="btn gold" id="againBtn">↻ Fight again</button>
      <button class="btn ghost" id="newRoundBtn">＋ New round</button>
    </div>
  </div>
</div>

<script>
"use strict";
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==='number') r=[r,r,r,r];
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y); this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]); this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h); this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]); this.quadraticCurveTo(x,y,x+r[0],y);
    return this;
  };
}

const BOSSES = [
  { name:'Word Wizard',       type:'wraith',  hue:265, hp:100 },
  { name:'Tense Troll',       type:'troll',   hue:100, hp:115 },
  { name:'Subject Specter',   type:'ghost',   hue:195, hp:105 },
  { name:'Ending Eater',      type:'slime',   hue:95,  hp:120 },
  { name:'Connector Count',   type:'vampire', hue:345, hp:125 },
  { name:'Pronoun Patrol',    type:'robot',   hue:205, hp:120 },
  { name:'Punctuation Beast', type:'dragon',  hue:15,  hp:140 },
  { name:'Adjective Witch',   type:'witch',   hue:280, hp:130 },
  { name:'Overlord',          type:'knight',  hue:220, hp:145 },
  { name:'Infinitive Mimic',  type:'book',    hue:35,  hp:135 }
];

const PRESETS = [
  { label:'Word order', text:'The cat chases the mouse\nMy brother reads a book' },
  { label:'Past tense', text:'She walked to school yesterday\nThey played football last night' },
  { label:'Questions',  text:'Where did you go\nWhat time does it start' },
  { label:'Adjectives', text:'I saw a big red house\nShe bought a lovely old table' },
  { label:'Connectors', text:'I like tea but not coffee\nHe was tired so he slept' }
];

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=canvas.width, H=canvas.height;

const state={
  sentences:[], sIdx:0, target:[], placed:0, tiles:[],
  boss:BOSSES[0], bossIdx:0,
  heroHP:100, heroMax:100, heroShown:100,
  bossHP:100, bossMax:100, bossShown:100,
  combo:0, bestCombo:0, score:0, mistakes:0,
  done:[], busy:false, running:false
};

function heroPos(){ return {x:190,y:340}; }
function bossPos(){ return {x:745,y:300}; }

let projectiles=[],particles=[],popups=[],rings=[];
let heroAnim={bob:0,hit:0,cast:0}, bossAnim={bob:0,hit:0,lunge:0,dead:0};
let shake=0;

let actx=null;
function sfx(type){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    if(type==='hit'){o.type='triangle';o.frequency.setValueAtTime(680,t);
      o.frequency.exponentialRampToValueAtTime(180,t+0.18);g.gain.setValueAtTime(0.18,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.21);}
    else if(type==='miss'){o.type='sawtooth';o.frequency.setValueAtTime(200,t);
      o.frequency.exponentialRampToValueAtTime(70,t+0.25);g.gain.setValueAtTime(0.14,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.28);o.start(t);o.stop(t+0.29);}
    else if(type==='win'){[523,659,784,1047].forEach((f,i)=>{
      const oo=actx.createOscillator(),gg=actx.createGain();
      oo.connect(gg);gg.connect(actx.destination);oo.type='triangle';
      oo.frequency.setValueAtTime(f,t+i*0.1);gg.gain.setValueAtTime(0.14,t+i*0.1);
      gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.28);
      oo.start(t+i*0.1);oo.stop(t+i*0.1+0.3);});}
  }catch(e){}
}

function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);}

// split a sentence into playable tokens, keeping punctuation as its own tile
function tokenize(line){
  return String(line).trim().split(/\s+/).flatMap(tok=>{
    const m=/^(.*?)([.,!?;:]+)$/.exec(tok);
    return m && m[1] ? [m[1],m[2]] : [tok];
  }).filter(Boolean);
}

function buildRound(sentences){
  state.sentences=sentences.map(tokenize).filter(a=>a.length>1);
  state.sIdx=0;
  state.boss=BOSSES[state.bossIdx%BOSSES.length];
  state.heroHP=state.heroMax=100; state.heroShown=100;
  state.bossHP=state.bossMax=state.boss.hp; state.bossShown=state.boss.hp;
  state.combo=0; state.bestCombo=0; state.score=0; state.mistakes=0;
  state.done=[]; state.busy=false; state.running=true;
  projectiles=[];particles=[];popups=[];rings=[];
  bossAnim.dead=0;
  loadSentence();
}

function loadSentence(){
  state.target=state.sentences[state.sIdx]||[];
  state.placed=0;
  layoutTiles();
}

const TILE_TOP = 424;   // tiles must stay below the sentence bar
const TILE_BOTTOM = 596;

function layoutTiles(){
  const words=state.target.map((w,i)=>({word:w,idx:i,used:false,shake:0,pop:0}));
  const arr=shuffle(words);
  // long sentences get smaller tiles so everything still fits on screen
  const many=arr.length>9;
  const fs=many?15:17, padX=many?26:34, th=many?36:42, gap=many?9:12;
  const rowH=th+8;
  state.tileFont='600 '+fs+'px Segoe UI';
  ctx.font=state.tileFont;
  arr.forEach(t=>{ t.w=Math.max(46,ctx.measureText(t.word).width+padX); t.h=th; });

  const maxW=W-90;
  const rows=[]; let row=[],rowW=0;
  for(const t of arr){
    if(row.length && rowW+t.w+gap>maxW){ rows.push(row); row=[]; rowW=0; }
    row.push(t); rowW+=t.w+gap;
  }
  if(row.length) rows.push(row);

  // centre the block vertically inside the tray, clamped so it never
  // rides up into the sentence bar
  const blockH=rows.length*rowH-8;
  let startY=Math.max(TILE_TOP+th/2, TILE_BOTTOM-blockH+th/2);
  rows.forEach((r,ri)=>{
    const total=r.reduce((s,t)=>s+t.w+gap,0)-gap;
    let x=W/2-total/2;
    r.forEach(t=>{ t.x=x+t.w/2; t.y=startY+ri*rowH; x+=t.w+gap; });
  });
  state.tiles=arr;
}

function parseSentences(raw){
  return String(raw).split(/\n+/).map(s=>s.trim()).filter(Boolean).slice(0,12);
}
function encodeRound(s){ try{return btoa(unescape(encodeURIComponent(JSON.stringify({s}))));}catch(e){return '';} }
function decodeRound(hash){
  try{
    const m=/[#&]s=([^&]+)/.exec(hash); if(!m) return null;
    // the payload may arrive percent-encoded when the host app builds the link
    const raw = /%[0-9a-fA-F]{2}/.test(m[1]) ? decodeURIComponent(m[1]) : m[1];
    const o=JSON.parse(decodeURIComponent(escape(atob(raw))));
    return Array.isArray(o.s)&&o.s.length?o.s:null;
  }catch(e){ return null; }
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setStatus(h){ document.getElementById('statusLine').innerHTML=h; }

const presetChips=document.getElementById('presetChips');
PRESETS.forEach(p=>{
  const c=document.createElement('span'); c.className='chip'; c.textContent=p.label;
  c.onclick=()=>{ document.getElementById('sentInput').value=p.text; };
  presetChips.appendChild(c);
});

document.getElementById('startBtn').onclick=()=>{
  const s=parseSentences(document.getElementById('sentInput').value);
  if(!s.length){ document.getElementById('sentInput').focus(); return; }
  buildRound(s);
  if(!state.sentences.length){ setStatus('Each sentence needs at least two words.'); return; }
  showScreen('screenBattle');
  setStatus('Click the words in the correct order');
};
document.getElementById('shareBtn').onclick=()=>{
  const s=parseSentences(document.getElementById('sentInput').value);
  if(!s.length){ document.getElementById('sentInput').focus(); return; }
  document.getElementById('shareUrl').value=location.href.split('#')[0]+'#s='+encodeRound(s);
  document.getElementById('shareBox').classList.add('show');
};
document.getElementById('copyBtn').onclick=()=>{
  const el=document.getElementById('shareUrl'); el.select();
  try{ document.execCommand('copy');
    document.getElementById('copyBtn').textContent='Copied ✓';
    setTimeout(()=>document.getElementById('copyBtn').textContent='Copy link',1600);}catch(e){}
};
document.getElementById('quitBtn').onclick=()=>{ state.running=false; showScreen('screenSetup'); };
document.getElementById('newRoundBtn').onclick=()=>showScreen('screenSetup');
document.getElementById('againBtn').onclick=()=>{
  state.bossIdx++;
  buildRound(state.sentences.map(a=>a.join(' ')));
  showScreen('screenBattle');
  setStatus('New boss — same sentences');
};

/* ---------------- input ---------------- */
canvas.addEventListener('click',e=>{
  if(state.busy||!state.running) return;
  const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(W/r.width), my=(e.clientY-r.top)*(H/r.height);
  for(const t of state.tiles){
    if(t.used) continue;
    if(mx>t.x-t.w/2&&mx<t.x+t.w/2&&my>t.y-t.h/2&&my<t.y+t.h/2){ pick(t); break; }
  }
});

function pick(tile){
  if(state.busy||!state.running||!tile||tile.used) return;
  state.busy=true;
  // match on the WORD, not the tile's original slot — a sentence like
  // "the cat chases the mouse" has interchangeable duplicate tiles, and
  // clicking either of them must count as correct
  if(tile.word===state.target[state.placed]){
    tile.used=true; tile.pop=1;
    state.combo++; state.bestCombo=Math.max(state.bestCombo,state.combo);
    state.placed++;
    const dmg=Math.round(11+state.combo*2.2);
    state.score+=10+state.combo*3;
    heroAnim.cast=1; sfx('hit');
    setStatus('✔ <b>'+tile.word+'</b> — keep going');
    setTimeout(()=>{
      projectiles.push(proj(heroPos(),bossPos(),'#7cf5c4',()=>{
        state.bossHP=Math.max(0,state.bossHP-dmg);
        bossAnim.hit=1; shake=9;
        burst(bossPos().x,bossPos().y,'#7cf5c4',24);
        rings.push({x:bossPos().x,y:bossPos().y,r:10,max:78,life:26,color:'#7cf5c4'});
        popup(bossPos().x,bossPos().y-46,'-'+dmg,'#7cf5c4',22);
        if(state.combo>1) popup(bossPos().x,bossPos().y-70,'COMBO x'+state.combo,'#ffd166',17);
        afterHit();
      }));
    },160);
  }else{
    tile.shake=14; state.combo=0; state.mistakes++;
    bossAnim.lunge=1; sfx('miss');
    setStatus('✘ Not next — the sentence needs a different word here');
    setTimeout(()=>{
      projectiles.push(proj(bossPos(),heroPos(),'#ff5d73',()=>{
        state.heroHP=Math.max(0,state.heroHP-13);
        heroAnim.hit=1; shake=11;
        burst(heroPos().x,heroPos().y,'#ff5d73',22);
        popup(heroPos().x,heroPos().y-46,'-13','#ff5d73',20);
        afterHit();
      }));
    },160);
  }
}

function afterHit(){
  state.busy=false;
  if(state.heroHP<=0){ state.running=false; setTimeout(()=>results(false),700); return; }
  if(state.bossHP<=0){ bossAnim.dead=1; state.running=false; state.score+=100; sfx('win');
    state.done.push(state.target.join(' ')); setTimeout(()=>results(true),950); return; }
  if(state.placed>=state.target.length){
    state.done.push(state.target.join(' '));
    state.score+=40;
    state.sIdx++;
    if(state.sIdx>=state.sentences.length){ state.running=false;
      const won=state.bossHP<state.bossMax*0.5; if(won) sfx('win');
      setTimeout(()=>results(won),700); return; }
    setTimeout(()=>{ loadSentence(); setStatus('Sentence complete — next one!'); },500);
  }
}

function results(won){
  document.getElementById('resultsTitle').textContent= won? state.boss.name+' Defeated!':'Round Over';
  document.getElementById('resultsSub').innerHTML=
    'Score <b style="color:var(--accent)">'+state.score+'</b> · '+
    state.done.length+' sentence'+(state.done.length===1?'':'s')+' built · '+
    state.mistakes+' mistake'+(state.mistakes===1?'':'s')+' · best combo x'+state.bestCombo;
  const list=document.getElementById('resultsList'); list.innerHTML='';
  state.done.forEach(s=>{
    const d=document.createElement('div'); d.className='sentRow';
    d.innerHTML='<div class="s">✔ '+s+'</div>';
    list.appendChild(d);
  });
  if(!state.done.length){
    list.innerHTML='<div class="sentRow"><div class="m">No sentence finished — try again!</div></div>';
  }
  state.bossIdx++;
  showScreen('screenResults');
  reportToTrainer(won);
}

/* Embedded in Antoch Session Trainer this hands the round back to
   the parent window; standalone it is a no-op. */
function reportToTrainer(won){
  if(window.parent === window) return;
  try{
    window.parent.postMessage({
      source:'antoch-game', game:'sentence',
      won:!!won, score:state.score, mistakes:state.mistakes,
      bestCombo:state.bestCombo, built:state.done.slice()
    }, '*');
  }catch(e){}
}

/* ---------------- effects ---------------- */
function proj(f,t,c,cb){return {x:f.x,y:f.y,fx:f.x,fy:f.y,tx:t.x,ty:t.y,t:0,color:c,onArrive:cb,spin:0};}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1.2+Math.random()*4.5;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:36,max:36,color:c,r:1.6+Math.random()*2.6});}}
function popup(x,y,t,c,s){popups.push({x,y,text:t,color:c,size:s||18,life:56,max:56});}

/* ---------------- background ---------------- */
const stars=Array.from({length:120},()=>({x:Math.random()*W,y:15+Math.random()*250,
  r:0.4+Math.random()*1.6,seed:Math.random()*10}));
const farHills=(()=>{const a=[];let x=-40;while(x<W+40){a.push({x,w:120+Math.random()*180,h:50+Math.random()*70});x+=90+Math.random()*90;}return a;})();
const towers=(()=>{const a=[];let x=-30;while(x<W+30){const w=24+Math.random()*44,h=70+Math.random()*150;
  a.push({x,w,h,roof:16+Math.random()*22,lit:Math.random()<0.7});x+=w+12+Math.random()*34;}return a;})();
const motes=Array.from({length:34},()=>({x:Math.random()*W,y:Math.random()*H,
  r:0.9+Math.random()*2.3,sp:0.12+Math.random()*0.4,drift:(Math.random()-0.5)*0.35,
  seed:Math.random()*10,hue:Math.random()<0.5?150:45}));
let shooting=null,shootTimer=220;

function drawBackground(t){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#07031a');sky.addColorStop(0.42,'#180f3e');
  sky.addColorStop(0.72,'#2a1a54');sky.addColorStop(1,'#120a2c');
  ctx.fillStyle=sky;ctx.fillRect(-30,-30,W+60,H+60);
  for(let i=0;i<3;i++){
    const cx=180+i*300+Math.sin(t*0.12+i)*30,cy=90+i*22;
    const g=ctx.createRadialGradient(cx,cy,10,cx,cy,150);const hue=[280,200,320][i];

      ctx.strokeStyle='hsl('+hue+',60%,14%)';ctx.lineWidth=3;ctx.stroke();
      for(let i=0;i<2;i++){const hx=-16+i*32;
        ctx.beginPath();ctx.moveTo(hx-8,-30);ctx.lineTo(hx,-62);ctx.lineTo(hx+8,-30);
        ctx.closePath();ctx.fillStyle='hsl('+hue+',42%,72%)';ctx.fill();}
      eye(-16,0,8,hue);eye(16,0,8,hue);fangs(38,24,5);
      ctx.fillStyle='rgba(255,120,40,'+(0.3+0.25*Math.abs(Math.sin(t*3)))+')';
      ctx.beginPath();ctx.ellipse(0,46,16,7,0,0,Math.PI*2);ctx.fill();break;
    case 'witch':
      ctx.beginPath();ctx.moveTo(-32,-8);ctx.quadraticCurveTo(-40,46,-18,74);ctx.lineTo(18,74);
      ctx.quadraticCurveTo(40,46,32,-8);ctx.closePath();
      ctx.fillStyle=bfill(hue,48,42,40,18);ctx.fill();
      ctx.beginPath();ctx.ellipse(0,-17,20,20,0,0,Math.PI*2);ctx.fillStyle='#bfe08c';ctx.fill();
      ctx.fillStyle='hsl('+hue+',60%,14%)';
      ctx.beginPath();ctx.ellipse(0,-24,33,8,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(-15,-28);ctx.quadraticCurveTo(2,-58,8,-84);
      ctx.quadraticCurveTo(14,-56,15,-26);ctx.closePath();ctx.fill();
      ctx.fillStyle='hsl('+hue+',70%,58%)';
      ctx.beginPath();ctx.ellipse(0,-30,12,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1a0f22';ctx.beginPath();ctx.arc(-7,-18,2.8,0,Math.PI*2);ctx.arc(7,-18,2.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(-4,-8);ctx.lineTo(4,-8);ctx.lineTo(0,-2);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#8b6a3a';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(30,-4);ctx.lineTo(46,-46);ctx.stroke();
      ctx.fillStyle='hsl('+hue+',80%,'+(62+Math.sin(t*4)*10)+'%)';
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=16;
      ctx.beginPath();ctx.arc(47,-49,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;break;
    case 'knight':
      ctx.save();ctx.translate(50,-8);ctx.rotate(-0.5+Math.sin(t*1.4)*0.06);
      ctx.strokeStyle='#d6dce6';ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(0,-52);ctx.lineTo(0,22);ctx.stroke();
      ctx.strokeStyle='#8a93a3';ctx.lineWidth=11;
      ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(14,-4);ctx.stroke();ctx.restore();
      ctx.beginPath();ctx.roundRect(-44,-16,88,74,16);
      ctx.fillStyle=bfill(hue,32,38,26,16);ctx.fill();
      ctx.strokeStyle='hsl('+hue+',30%,9%)';ctx.lineWidth=3;ctx.stroke();
      ctx.beginPath();ctx.arc(-38,-10,13,0,Math.PI*2);ctx.arc(38,-10,13,0,Math.PI*2);
      ctx.fillStyle='hsl('+hue+',30%,48%)';ctx.fill();
      ctx.fillStyle='hsl('+hue+',35%,30%)';
      ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(20,4);ctx.lineTo(0,34);ctx.lineTo(-20,4);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.ellipse(0,-38,19,21,0,0,Math.PI*2);ctx.fillStyle='#e9edf2';ctx.fill();
      ctx.fillStyle='#08040f';ctx.beginPath();ctx.arc(-7,-40,4.4,0,Math.PI*2);ctx.arc(7,-40,4.4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='hsl('+hue+',85%,70%)';
      ctx.beginPath();ctx.arc(-7,-40,2,0,Math.PI*2);ctx.arc(7,-40,2,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.translate(0,-24);fangs(0,11,4);ctx.restore();break;
    case 'book':
      ctx.save();ctx.rotate(-0.09+Math.sin(t*2)*0.03);
      ctx.beginPath();ctx.moveTo(0,-50);ctx.lineTo(-60,-36);ctx.lineTo(-60,48);ctx.lineTo(0,62);ctx.closePath();
      ctx.fillStyle=bfill(hue,58,52,46,24);ctx.fill();
      ctx.strokeStyle='hsl('+hue+',60%,14%)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
      ctx.save();ctx.rotate(0.09-Math.sin(t*2)*0.03);
      ctx.beginPath();ctx.moveTo(0,-50);ctx.lineTo(60,-36);ctx.lineTo(60,48);ctx.lineTo(0,62);ctx.closePath();
      ctx.fillStyle=bfill(hue,48,42,36,18);ctx.fill();
      ctx.strokeStyle='hsl('+hue+',60%,14%)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
      eye(0,-16,9,hue);
      ctx.beginPath();ctx.ellipse(0,32,28,17,0,0,Math.PI*2);ctx.fillStyle='#b8283e';ctx.fill();
      ctx.fillStyle='#fff';
      for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*11-4,20);ctx.lineTo(i*11+4,20);
        ctx.lineTo(i*11,32);ctx.closePath();ctx.fill();}
      ctx.fillStyle='#e0566e';
      ctx.beginPath();ctx.ellipse(0,44+Math.sin(t*4)*3,11,7,0,0,Math.PI*2);ctx.fill();break;
    default:
      ctx.beginPath();ctx.ellipse(0,22,62,54,0,0,Math.PI*2);
      ctx.fillStyle=bfill(hue,80,56,70,28);ctx.fill();
      eye(-20,2,10,hue);eye(20,2,10,hue);fangs(38,28,6);
  }
  ctx.restore();ctx.globalAlpha=1;
}

/* ---------------- HUD + tiles ---------------- */
function hpBar(x,y,w,h,pct,cols,label){
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.roundRect(-3,-3,w+6,h+6,(h+6)/2);
  ctx.fillStyle='rgba(10,4,24,0.75)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.roundRect(0,0,w,h,h/2);ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fill();
  const fw=Math.max(0,Math.min(1,pct))*w;
  if(fw>0){
    ctx.save();ctx.beginPath();ctx.roundRect(0,0,fw,h,h/2);ctx.clip();
    const g=ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,0.22)';ctx.fillRect(0,0,w,h*0.42);ctx.restore();
  }
  for(let i=1;i<5;i++){ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(w*i/5,0);ctx.lineTo(w*i/5,h);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.font='700 12px Segoe UI';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=4;
  ctx.fillText(label,8,h/2+0.5);ctx.shadowBlur=0;ctx.restore();
}

function drawSentenceBar(){
  const y=388;   // sits clear of TILE_TOP
  ctx.save();
  ctx.beginPath();ctx.roundRect(W/2-390,y-34,780,60,16);
  ctx.fillStyle='rgba(14,7,32,0.72)';ctx.fill();
  ctx.strokeStyle='rgba(124,92,200,0.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 22px Segoe UI';
  const parts=state.target.map((w,i)=> i<state.placed ? w : '____');
  const full=parts.join(' ');
  let size=22;
  while(ctx.measureText(full).width>740 && size>12){ size--; ctx.font='700 '+size+'px Segoe UI'; }
  let x=W/2-ctx.measureText(full).width/2;
  ctx.textAlign='left';
  state.target.forEach((w,i)=>{
    const txt=(i<state.placed?w:'____')+(i<state.target.length-1?' ':'');
    ctx.fillStyle= i<state.placed ? '#7cf5c4' : '#6b5b96';
    if(i<state.placed){ ctx.shadowColor='#7cf5c4'; ctx.shadowBlur=12; }
    ctx.fillText(txt,x,y-4);
    ctx.shadowBlur=0;
    x+=ctx.measureText(txt).width;
  });
  ctx.textAlign='center';
  ctx.font='600 11px Segoe UI';ctx.fillStyle='#a996d6';
  ctx.fillText('SENTENCE '+(state.sIdx+1)+' OF '+state.sentences.length, W/2, y+16);
  ctx.restore();
}

function drawTiles(){
  for(const t of state.tiles){
    ctx.save();
    const sx=t.shake>0?(Math.random()-0.5)*t.shake:0;
    const pop=1+t.pop*0.25;
    ctx.translate(t.x+sx,t.y);ctx.scale(pop,pop);
    ctx.globalAlpha=t.used?0.22:1;
    ctx.beginPath();ctx.roundRect(-t.w/2,-t.h/2,t.w,t.h,11);
    if(t.used){
      ctx.fillStyle='rgba(124,245,196,0.10)';ctx.strokeStyle='rgba(124,245,196,0.4)';
    }else{
      const g=ctx.createLinearGradient(0,-t.h/2,0,t.h/2);
      g.addColorStop(0,'rgba(76,58,124,0.95)');g.addColorStop(1,'rgba(42,28,78,0.95)');
      ctx.fillStyle=g;ctx.strokeStyle='rgba(180,155,255,0.55)';
      ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=8;
    }
    ctx.lineWidth=2;ctx.fill();ctx.shadowBlur=0;ctx.stroke();
    if(!t.used){
      ctx.beginPath();ctx.roundRect(-t.w/2+3,-t.h/2+3,t.w-6,t.h*0.4,8);
      ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fill();
    }
    ctx.fillStyle=t.used?'#7cf5c4':'#f3eeff';
    ctx.font=state.tileFont||'600 17px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t.word,0,1);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  hpBar(56,40,250,20,state.heroShown/state.heroMax,['#8ffcd0','#3fae7f'],
    'SENTENCE SEEKER  '+Math.max(0,Math.round(state.heroHP)));
  hpBar(W-306,40,250,20,state.bossShown/state.bossMax,['#ffb35d','#ff5d73'],
    state.boss.name.toUpperCase()+'  '+Math.max(0,Math.round(state.bossHP)));
  ctx.textAlign='center';ctx.font='700 13px Segoe UI';ctx.fillStyle='#ffd166';
  ctx.fillText('SCORE '+state.score,W/2,48);
  if(state.combo>1){ctx.font='700 15px Segoe UI';ctx.fillStyle='#ffd166';
    ctx.fillText('COMBO x'+state.combo,W/2,68);}
}

/* ---------------- loop ---------------- */
function update(){
  heroAnim.bob+=0.05;bossAnim.bob+=0.045;
  heroAnim.hit*=0.86;bossAnim.hit*=0.86;
  heroAnim.cast*=0.88;bossAnim.lunge*=0.88;
  if(bossAnim.dead>0&&bossAnim.dead<1) bossAnim.dead=Math.min(1,bossAnim.dead+0.02);
  shake*=0.86;
  state.heroShown+=(state.heroHP-state.heroShown)*0.12;
  state.bossShown+=(state.bossHP-state.bossShown)*0.12;
  for(const t of state.tiles){ if(t.shake>0)t.shake*=0.8; if(t.pop>0)t.pop*=0.85; }
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.t+=0.065;p.spin+=0.3;
    if(p.t>=1){p.onArrive();projectiles.splice(i,1);}
    else{
      const arc=Math.sin(p.t*Math.PI)*-70;
      p.x=p.fx+(p.tx-p.fx)*p.t;p.y=p.fy+(p.ty-p.fy)*p.t+arc;
      if(Math.random()<0.7) particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*0.7,
        vy:(Math.random()-0.5)*0.7,life:16,max:16,color:p.color,r:1.4+Math.random()*1.6});
    }
  }
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];
    q.x+=q.vx;q.y+=q.vy;q.vy+=0.08;q.life--;if(q.life<=0)particles.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--){const u=popups[i];u.y-=0.75;u.life--;if(u.life<=0)popups.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.max-r.r)*0.16;r.life--;if(r.life<=0)rings.splice(i,1);}
}

function render(){
  const t=performance.now()*0.001;
  ctx.save();
  ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.clearRect(-30,-30,W+60,H+60);
  drawBackground(t);
  drawHero(t);
  drawBoss(t);
  drawHUD();
  for(const r of rings){
    ctx.globalAlpha=Math.max(0,r.life/26)*0.7;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;
  }
  for(const p of projectiles){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);
    ctx.shadowColor=p.color;ctx.shadowBlur=22;ctx.fillStyle=p.color;
    ctx.beginPath();
    for(let i=0;i<4;i++){const a=i*Math.PI/2;
      ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11);
      ctx.lineTo(Math.cos(a+Math.PI/4)*4.5,Math.sin(a+Math.PI/4)*4.5);}
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
  }
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);
    ctx.fillStyle=q.color;ctx.fill();ctx.globalAlpha=1;
  }
  for(const u of popups){
    const k=u.life/u.max;ctx.globalAlpha=Math.max(0,k);
    ctx.font='700 '+(u.size*(1+(1-k)*0.25))+'px Segoe UI';ctx.textAlign='center';
    ctx.fillStyle=u.color;ctx.shadowColor='rgba(0,0,0,0.85)';ctx.shadowBlur=6;
    ctx.fillText(u.text,u.x,u.y);ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  if(state.target.length){ drawSentenceBar(); drawTiles(); }
  vignette();
  ctx.restore();
}
function loop(){update();render();requestAnimationFrame(loop);}

(function boot(){
  const shared=decodeRound(location.hash);
  if(shared){
    document.getElementById('sentInput').value=shared.join('\n');
    buildRound(shared);
    showScreen('screenBattle');
    setStatus('Your trainer picked these sentences — build the first one');
  }else{
    buildRound(['The cat chases the mouse']);
    state.running=false;
  }
  loop();
})();
</script>
